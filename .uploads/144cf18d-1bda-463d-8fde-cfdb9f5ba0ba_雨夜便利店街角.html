function makeOverlayMaterial() {

      float h12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

  moon.castShadow = true; moon.shadow.mapSize.set(4096, 4096); moon.shadow.bias = -0.0012; moon.shadow.normalBias = 0.1; moon.shadow.radius = 0.7;
  const sc = moon.shadow.camera; sc.left = sc.bottom = -12.5; sc.right = sc.top = 12.5; sc.near = 4; sc.far = 60;
  Object.assign(dyn, { hemi, moon });
}
// Registers a light on a power channel and adds it to the scene.
function light(name, l, base) { l.intensity = 0; scene.add(l); if (l.target) scene.add(l.target); chan(name, l, base); return l; }

function boot() {
  const canvas = document.getElementById('scene');
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    showNotice('当前浏览器无法创建 WebGL 上下文，请换用较新的 Chrome / Edge / Firefox 后重试。');
    return;
  }
  usePost = renderer.capabilities.isWebGL2 && !/nopost/.test(HASH);
  maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
  renderer.setClearColor(0x000000, 0); renderer.info.autoReset = false;

  scene = new THREE.Scene();
  if (!usePost) scene.background = new THREE.Color(0x141936);
  camera = new THREE.PerspectiveCamera(32, 1, 0.3, 90);
  orbit = new Orbit(canvas, camera);
  orbit.onInteract = () => { introDone = true; };
  if (DEBUG) Object.assign(window, { __dbg: { renderer, scene, camera, orbit, THREE,
    advance: (secs, fps = 24) => { const n = Math.round(secs * fps), t0 = performance.now(); for (let i = 0; i < n; i++) step(1 / fps); simMs = (performance.now() - t0) / n; },   // drive time forward without waiting
    skipIntro: () => { introDone = true; }, rewind: (t) => { introDone = false; time = t; }, dyn, chans, fade: (v) => fadeUniforms.forEach((u) => { u.value = v; }), fadeUniforms } });

  const BS = new Batch(), BS0 = new Batch({ outline: false }), BE = new Batch({ lit: false }), BE0 = new Batch({ outline: false, lit: false, shadow: false });
  const BR = new Batch({ outline: false, lit: false, shadow: false }), BQ = new Batch({ outline: false, lit: false, shadow: false });
  S = api(BS); S0 = api(BS0); E = api(BE); E0 = api(BE0); R = api(BR); SH = api(BQ);
  reflCam = new THREE.PerspectiveCamera(); reflRt = new THREE.WebGLRenderTarget(256, 256);
  buildGround();
  makeMaterials();
  buildStore(); buildStoreInside(); buildStreet(); buildEffects();
  makeLights();

  for (const m of [...GND.build(toonMatGround, 'ground'), ...BS.build(toonMat, 'solid'), ...BS0.build(toonMat, 'solid0'),
    ...BE.build(glowMat, 'glow'), ...BE0.build(glowMat, 'glow0'), ...INSTS.flatMap((i) => i.build('inst')),
    ...BR.build(roomGlowMat, 'roomGlow'), ...BQ.build(shopGlowMat, 'shopGlow')]) scene.add(m);
  chan('room', roomGlowMat, 1, 'color'); chan('shop', shopGlowMat, 1, 'color');
  for (const m of BASE.build(toonMat, 'base')) { scene.add(m); noRefl.add(m); }
  for (const m of OVER.build(overlayMat, 'wet')) { scene.add(m); noRefl.add(m); }

  post = usePost ? new Post() : null;
  addEventListener('resize', resize);
  resize();
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); showNotice('图形上下文已丢失，正在尝试恢复…'); });
  canvas.addEventListener('webglcontextrestored', () => location.reload());
  requestAnimationFrame(frame);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  const pr = Math.max(0.75, Math.min(devicePixelRatio || 1, 2, prCap, Math.sqrt(4.4e6 / (w * h))));
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix(); orbit.setAspect(camera.aspect);
  const W = Math.round(w * pr), H = Math.round(h * pr);
  uPx = 2 * Math.tan(camera.fov * DEG / 2) / H;
  outlineMat.uniforms.uThickness.value = OUTLINE_PX * uPx;
  if (usePost) { post.setSize(W, H); reflRt.setSize(Math.max(2, W >> 1), Math.max(2, H >> 1)); }
  for (const f of resized) f(W, H);
}

function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000 || 0.016; last = now;
  if (document.hidden) return;
  step(Math.min(0.1, raw), raw);
  perf = perf * 0.94 + raw * 0.06;
  if (!perfDone && time > 4) {                                           // one-shot: drop resolution if the GPU cannot keep up
    perfDone = true;
    if (perf > 0.036 && prCap > 1) { prCap = 1; resize(); }
  }
}

// One simulated frame: animation + reflection pass + main pass + post.
function step(dt, raw = dt) {
  time += dt; frameMs = frameMs * 0.9 + raw * 100; frameN++;
  orbit.update(dt);
  updateChannels(time);
  for (const f of animated) f(dt, time);
  if (overlayMat) overlayMat.uniforms.uTime.value = time;
  renderer.info.reset(); renderer.shadowMap.needsUpdate = true;
  if (usePost) {
    updateReflectionCamera();
    for (const o of noRefl) o.visible = false;
    renderer.setRenderTarget(reflRt); renderer.render(scene, reflCam);
    for (const o of noRefl) o.visible = true;
    renderer.setRenderTarget(post.rt); renderer.render(scene, camera);
    post.render();
  } else {
    updateReflectionCamera();
    for (const o of noRefl) o.visible = false;
    renderer.setRenderTarget(reflRt); renderer.render(scene, reflCam);
    for (const o of noRefl) o.visible = true;
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  }
  if (DEBUG) { document.body.dataset.ready = '1'; window.__dbg.stats = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, time: +time.toFixed(2), ms: +frameMs.toFixed(1), simMs: +simMs.toFixed(1), frames: frameN, programs: renderer.info.programs.length }; }
}

// Everything above only declares; the scene starts here once three.js is available.
if (!THREE) {
  showNotice('three.js 未能加载，请检查网络连接后刷新页面。');
} else {
  try { boot(); } catch (err) { console.error(err); showNotice('场景初始化失败：' + ((err && err.message) || err)); }
}
</script>
</body>
</html>
