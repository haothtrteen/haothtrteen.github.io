function gradientMap(steps){
  const data = new Uint8Array(steps);
  for(let i=0;i<steps;i++){
    const t = i/(steps-1);
    data[i] = Math.round(255 * Math.pow(t, 0.82));
  }
  // 让暗部不至于死黑，保留夜景层次
  data[0] = Math.round(data[0]*0.45 + 28);
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const GRAD3 = gradientMap(3);
const GRAD4 = gradientMap(4);
const GRAD5 = gradientMap(5);

const MATS = {};
function toon(name, color, opts={}){
  const m = new THREE.MeshToonMaterial({
    color,
    gradientMap: opts.grad || GRAD4,
    emissive: opts.emissive!==undefined ? opts.emissive : 0x000000,
    emissiveIntensity: opts.ei!==undefined ? opts.ei : 1,
    transparent: !!opts.transparent,
    opacity: opts.opacity!==undefined ? opts.opacity : 1,
    side: opts.side || THREE.FrontSide,
    fog: opts.fog!==undefined ? opts.fog : true
  });
  if(opts.map) m.map = opts.map;
  MATS[name] = m;
  return m;
}
function glow(name, color, intensity=1.6, opts={}){
  const m = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color).multiplyScalar(intensity),
    transparent: !!opts.transparent,

    side: opts.side || THREE.FrontSide,
    fog: opts.fog!==undefined ? opts.fog : false,
    toneMapped: false,
    depthWrite: opts.depthWrite!==undefined ? opts.depthWrite : true
  });
  if(opts.map) m.map = opts.map;
  MATS[name] = m;
  return m;
}

/* ============================================================
   3. 几何批处理（合并静态几何，压低 draw call）
   ============================================================ */
const _m4 = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _v = new THREE.Vector3();
const _s = new THREE.Vector3(1,1,1);

class Batch {
  constructor(){ this.buckets = new Map(); }
  add(geo, mat, pos, rot, scale, opt={}){
    const key = mat.uuid + '|' + (opt.cast===false?'0':'1') + '|' + (opt.recv===false?'0':'1') + '|' + (opt.layer||0);
    let b = this.buckets.get(key);
    if(!b){ b = {mat, geos:[], cast:opt.cast!==false, recv:opt.recv!==false, layer:opt.layer||0}; this.buckets.set(key,b); }
    const g = geo.clone();
    _e.set(rot?rot[0]:0, rot?rot[1]:0, rot?rot[2]:0);
    _q.setFromEuler(_e);
    _v.set(pos[0],pos[1],pos[2]);
    _s.set(scale?scale[0]:1, scale?scale[1]:1, scale?scale[2]:1);
    _m4.compose(_v,_q,_s);
    g.applyMatrix4(_m4);
    b.geos.push(g.index ? g.toNonIndexed() : g);
    if(g.index) g.dispose();
    return this;
  }
  box(mat,w,h,d,x,y,z,ry=0,opt){ return this.add(BOX, mat, [x,y,z],[0,ry,0],[w,h,d],opt); }
  cyl(mat,rt,rb,h,x,y,z,seg=12,opt){ return this.add(new THREE.CylinderGeometry(rt,rb,h,seg), mat,[x,y,z],null,null,opt); }
  flush(parent){
    const out = [];
    for(const b of this.buckets.values()){
      if(!b.geos.length) continue;
      const merged = BGU.mergeGeometries(b.geos, false);
      b.geos.forEach(g=>g.dispose());
      if(!merged) continue;
      merged.computeBoundingSphere();
      const mesh = new THREE.Mesh(merged, b.mat);
      mesh.castShadow = b.cast; mesh.receiveShadow = b.recv;
      mesh.layers.set(b.layer);
      mesh.matrixAutoUpdate = false;
      mesh.updateMatrix();
      parent.add(mesh);
      out.push(mesh);
    }
    this.buckets.clear();
    return out;
  }
}

function PLN(mat,w,h,x,y,z,rot=null,opt){ batch.add(new THREE.PlaneGeometry(w,h),mat,[x,y,z],rot,null,opt); }

function TUBE(mat, pts, r, seg=24, rad=6, opt){
  const curve = new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));

}

const maxAniso = renderer.capabilities.getMaxAnisotropy();

function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function T(c, srgb=true){
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.needsUpdate = true;
  return t;
}
function rr(ctx,a,b,w,h,r){ ctx.beginPath(); ctx.roundRect(a,b,w,h,r); }
function txt(ctx,s,x,y,size,color,font=JP,weight='700',align='center',base='middle'){
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline=base;
  ctx.fillText(s,x,y);
}
function noise(ctx,w,h,amt,alpha){
  const img = ctx.getImageData(0,0,w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*amt;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  ctx.putImageData(img,0,0);
}

/* ---- 地面反照率（俯视地图） ---- */
function groundAlbedo(){
  const S = 2048, [c,x] = cv(S,S);
  const k = S/BASE;
  const X = v=>(v+HALF)*k, Z = v=>(v+HALF)*k, U = v=>v*k;
  const rect=(x0,z0,x1,z1,col)=>{ x.fillStyle=col; x.fillRect(X(x0),Z(z0),U(x1-x0),U(z1-z0)); };

  // 底色：湿润沥青（中间调，夜景由着色器压暗）
  rect(-HALF,-HALF,HALF,HALF,'#39404e');
  // 街区底（建筑下方 / 后场）
  rect(-HALF,-HALF,L.wbX1,L.swZ1,'#333947');
  rect(L.alX0,-HALF,L.sx1,L.sz1,'#3a4150');
  rect(L.sx0,L.sz0,L.pkX1,L.pkZ0,'#343b49');

  // 人行道（店前 + 对面）
  const pave=(x0,z0,x1,z1,base)=>{
    rect(x0,z0,x1,z1,base);
    x.strokeStyle='rgba(20,24,32,0.55)'; x.lineWidth=Math.max(1,U(0.035));
    for(let gx=Math.ceil(x0/0.6)*0.6; gx<x1; gx+=0.6){ x.beginPath(); x.moveTo(X(gx),Z(z0)); x.lineTo(X(gx),Z(z1)); x.stroke(); }
    for(let gz=Math.ceil(z0/0.6)*0.6; gz<z1; gz+=0.6){ x.beginPath(); x.moveTo(X(x0),Z(gz)); x.lineTo(X(x1),Z(gz)); x.stroke(); }
  };
  pave(L.alX0,L.swZ0,L.nsX0,L.swZ1,'#6b7385');
  pave(-HALF,L.fsZ0,HALF,L.fsZ1,'#616979');
  pave(L.fsX0,-HALF,HALF,HALF,'#616979');
  // 人行道上的浅色修补块
  for(let i=0;i<26;i++){
    const px=srr(-11,12), pz=srr(0.9,3.4);
    x.fillStyle=`rgba(120,130,150,${srr(0.03,0.09)})`;
    x.fillRect(X(px),Z(pz),U(0.6),U(0.6));
  }

  // 停车场
  rect(L.pkX0,L.pkZ0,L.pkX1,L.pkZ1,'#3d4453');
  x.strokeStyle='rgba(226,232,240,0.82)'; x.lineWidth=U(0.11);
  const bay=(z0,z1,n)=>{
    x.beginPath();
    x.moveTo(X(L.pkX0+0.2),Z(z0)); x.lineTo(X(L.pkX1-0.15),Z(z0));
    x.moveTo(X(L.pkX0+0.2),Z(z1)); x.lineTo(X(L.pkX1-0.15),Z(z1));
    x.moveTo(X(L.pkX1-0.15),Z(z0)); x.lineTo(X(L.pkX1-0.15),Z(z1));
    x.stroke();
    txt(x,String(n),X(L.pkX1-0.75),Z((z0+z1)/2),U(0.85),'rgba(226,232,240,0.55)',EN,'700');
  };
  bay(-6.4,-3.8,1); bay(-3.6,-1.0,2);
  // 斜线禁停区
  x.save(); x.beginPath(); x.rect(X(L.pkX0+0.2),Z(-0.8),U(4.2),U(1.5)); x.clip();
  x.strokeStyle='rgba(226,232,240,0.35)'; x.lineWidth=U(0.09);
  for(let i=-2;i<12;i++){ x.beginPath(); x.moveTo(X(L.pkX0+i*0.45),Z(-0.9)); x.lineTo(X(L.pkX0+i*0.45+1.6),Z(0.9)); x.stroke(); }
  x.restore();

  // 马路
  rect(-HALF,L.ewZ0,HALF,L.ewZ1,'#333a47');
  rect(L.nsX0,-HALF,L.nsX1,HALF,'#333a47');
  // 沥青补丁
  for(let i=0;i<40;i++){
    const px=srr(-13,13), pz=srr(3.7,8.7);
    x.fillStyle=`rgba(60,68,84,${srr(0.05,0.16)})`;
    x.beginPath(); x.ellipse(X(px),Z(pz),U(srr(0.4,1.6)),U(srr(0.3,1.0)),srr(0,3),0,TAU); x.fill();
  }
  for(let i=0;i<30;i++){
    const px=srr(6.3,10.9), pz=srr(-13,3.5);
    x.fillStyle=`rgba(60,68,84,${srr(0.05,0.15)})`;
    x.beginPath(); x.ellipse(X(px),Z(pz),U(srr(0.3,1.2)),U(srr(0.4,1.4)),srr(0,3),0,TAU); x.fill();
  }

  // 路缘白线
  x.strokeStyle='rgba(214,222,235,0.55)'; x.lineWidth=U(0.1);
  x.beginPath(); x.moveTo(X(-HALF),Z(L.ewZ0+0.18)); x.lineTo(X(L.nsX0-0.2),Z(L.ewZ0+0.18)); x.stroke();
  x.beginPath(); x.moveTo(X(-HALF),Z(L.ewZ1-0.18)); x.lineTo(X(0.6),Z(L.ewZ1-0.18)); x.stroke();
  x.beginPath(); x.moveTo(X(L.nsX1-0.18),Z(-HALF)); x.lineTo(X(L.nsX1-0.18),Z(L.ewZ1-0.2)); x.stroke();

  // 中央虚线
  x.strokeStyle='rgba(226,232,240,0.62)'; x.lineWidth=U(0.13); x.setLineDash([U(1.0),U(0.9)]);
  x.beginPath(); x.moveTo(X(-HALF),Z(6.2)); x.lineTo(X(1.2),Z(6.2)); x.stroke();
  x.beginPath(); x.moveTo(X(11.4),Z(6.2)); x.lineTo(X(HALF),Z(6.2)); x.stroke();
  x.beginPath(); x.moveTo(X(8.6),Z(-HALF)); x.lineTo(X(8.6),Z(3.2)); x.stroke();
  x.beginPath(); x.moveTo(X(8.6),Z(9.2)); x.lineTo(X(8.6),Z(HALF)); x.stroke();
  x.setLineDash([]);

  // 斑马线 A：横跨东西向马路
  const zebra=(x0,x1,z0,z1,along)=>{
    x.fillStyle='rgba(232,238,246,0.88)';
    if(along==='z'){ for(let z=z0; z<z1; z+=0.82) x.fillRect(X(x0),Z(z),U(x1-x0),U(0.44)); }
    else { for(let xx=x0; xx<x1; xx+=0.82) x.fillRect(X(xx),Z(z0),U(0.44),U(z1-z0)); }
  };
  zebra(1.7,5.3,3.95,8.5,'z');
  zebra(6.6,10.7,0.3,3.1,'x');
  // 停止线
  x.fillStyle='rgba(232,238,246,0.8)';
  x.fillRect(X(8.7),Z(3.25),U(2.2),U(0.28));
  x.fillRect(X(6.35),Z(8.95),U(2.2),U(0.28));
  // 路面文字
  x.save(); x.translate(X(9.8),Z(1.7)); x.rotate(Math.PI);
  txt(x,'止まれ',0,0,U(0.95),'rgba(232,238,246,0.75)',JP,'700'); x.restore();
  x.save(); x.translate(X(-6.0),Z(7.6));
  txt(x,'止まれ',0,0,U(0.95),'rgba(232,238,246,0.6)',JP,'700'); x.restore();
  // 导向箭头
  const arrow=(px,pz,rot)=>{
    x.save(); x.translate(X(px),Z(pz)); x.rotate(rot);
    x.fillStyle='rgba(232,238,246,0.5)';
    x.beginPath(); x.moveTo(0,-U(0.9)); x.lineTo(U(0.42),-U(0.1)); x.lineTo(U(0.16),-U(0.1));
    x.lineTo(U(0.16),U(0.9)); x.lineTo(-U(0.16),U(0.9)); x.lineTo(-U(0.16),-U(0.1)); x.lineTo(-U(0.42),-U(0.1));
    x.closePath(); x.fill(); x.restore();
  };
  arrow(-2.0,7.5,Math.PI/2); arrow(9.8,-4.0,0);

  // 排水沟
  const gutter=(x0,z0,x1,z1)=>{
    rect(x0,z0,x1,z1,'#232833');
    x.fillStyle='#171b24';
    if(x1-x0 > z1-z0){ for(let gx=x0+0.2; gx<x1-0.2; gx+=0.5) x.fillRect(X(gx),Z(z0+0.06),U(0.3),U(z1-z0-0.12)); }
    else { for(let gz=z0+0.2; gz<z1-0.2; gz+=0.5) x.fillRect(X(x0+0.06),Z(gz),U(x1-x0-0.12),U(0.3)); }
  };
  gutter(-HALF,L.ewZ0,L.nsX0-0.1,L.ewZ0+0.34);
  gutter(-HALF,L.ewZ1-0.34,0.4,L.ewZ1);
  gutter(L.nsX1-0.34,-HALF,L.nsX1,L.ewZ1);
  gutter(L.nsX0,L.ewZ1-0.34,L.nsX0+0.34,HALF);

  // 井盖
  const manhole=(px,pz,r)=>{
    x.save(); x.translate(X(px),Z(pz));
    x.fillStyle='#2a2f3b'; x.beginPath(); x.arc(0,0,U(r),0,TAU); x.fill();
    x.strokeStyle='#171b24'; x.lineWidth=U(0.06); x.beginPath(); x.arc(0,0,U(r*0.92),0,TAU); x.stroke();
    x.strokeStyle='rgba(150,160,180,0.22)'; x.lineWidth=U(0.045);
    for(let i=0;i<10;i++){ const a=i/10*TAU; x.beginPath(); x.moveTo(Math.cos(a)*U(r*0.25),Math.sin(a)*U(r*0.25)); x.lineTo(Math.cos(a)*U(r*0.85),Math.sin(a)*U(r*0.85)); x.stroke(); }
    x.beginPath(); x.arc(0,0,U(r*0.3),0,TAU); x.stroke();
    x.restore();
  };
  manhole(8.6,6.2,0.78); manhole(-4.2,7.3,0.62); manhole(-9.6,-2.6,0.5);

  // 盲道（黄色点状砖）
  const tactile=(x0,z0,x1,z1)=>{
    const horiz = (x1-x0)>(z1-z0);
    x.fillStyle='rgba(196,166,78,0.85)';
    if(horiz){ for(let gx=x0; gx<x1; gx+=0.32){ x.fillRect(X(gx),Z(z0),U(0.28),U(z1-z0)); } }
    else { for(let gz=z0; gz<z1; gz+=0.32){ x.fillRect(X(x0),Z(gz),U(x1-x0),U(0.28)); } }
  };
  tactile(-11.2,3.02,1.4,3.32);
  tactile(1.7,3.02,5.3,3.32);
  tactile(5.55,0.9,5.85,3.32);
  tactile(-HALF,9.0,1.4,9.3);
  tactile(6.6,9.0,HALF,9.3);
  // 店门口导视盲道
  tactile(-0.5,1.0,-0.2,3.02);

  // 小巷地面污渍
  for(let i=0;i<18;i++){
    x.fillStyle=`rgba(12,15,22,${srr(0.1,0.3)})`;
    x.beginPath(); x.ellipse(X(srr(-11.2,-8.2)),Z(srr(-12,0.5)),U(srr(0.3,1.1)),U(srr(0.3,1.3)),0,0,TAU); x.fill();
  }
  // 店前地面暖光晕（烘焙的灯光溢出，与着色器点光叠加）
  const spill=(px,pz,r,col)=>{
    const g=x.createRadialGradient(X(px),Z(pz),0,X(px),Z(pz),U(r));
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(X(px),Z(pz),U(r),0,TAU); x.fill();
  };
  spill(-3.2,2.0,5.2,'rgba(255,196,120,0.10)');
  spill(0.3,2.2,3.0,'rgba(255,206,140,0.10)');
  spill(-5.6,2.6,2.6,'rgba(255,90,130,0.08)');
  spill(5.4,3.2,4.0,'rgba(180,215,255,0.07)');
  spill(-9.4,-1.6,2.4,'rgba(255,190,130,0.06)');

  noise(x,S,S,10);
  return T(c);
}

  blob(-1.0,-8.6,2.2,1.1,0.6);
  blob(2.0,9.6,2.4,0.6,0.7);

  const t=T(c,false); return t;
}

function roundedShape(w,h,r){
  const s = new THREE.Shape();
  const x0=-w/2, y0=-h/2, x1=w/2, y1=h/2;
  s.moveTo(x0+r,y0);
  s.lineTo(x1-r,y0); s.quadraticCurveTo(x1,y0,x1,y0+r);
  s.lineTo(x1,y1-r); s.quadraticCurveTo(x1,y1,x1-r,y1);
  s.lineTo(x0+r,y1); s.quadraticCurveTo(x0,y1,x0,y1-r);
  s.lineTo(x0,y0+r); s.quadraticCurveTo(x0,y0,x0+r,y0);
  return s;
}

let _elapsed = 0;
const RIPPLE_N = 14;
const ripples = [];
for(let i=0;i<RIPPLE_N;i++) ripples.push(new THREE.Vector4(0,0,-99,0));
let rippleCursor = 0;
function spawnRipple(x,z,strength=1){

const groundShader = {
  name: 'WetGround',
  uniforms: {
    color: {value: new THREE.Color(0xffffff)},
    tDiffuse: {value: null},
    textureMatrix: {value: new THREE.Matrix4()},
    uGround: {value: TEX.ground},
    uPuddle: {value: TEX.puddle},
    uTime: {value: 0},
    uRipples: {value: ripples},
    uFogColor: {value: new THREE.Color(0x0a1020)},
    uFogDensity: {value: 0.0125}
  },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vProj;
    varying vec2 vUvG;
    varying vec3 vWorld;
    void main(){
      vUvG = uv;
      vWorld = (modelMatrix * vec4(position,1.0)).xyz;
      vProj = textureMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform sampler2D uGround;
    uniform sampler2D uPuddle;
    uniform float uTime;
    uniform vec4 uRipples[${RIPPLE_N}];
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    varying vec4 vProj;
    varying vec2 vUvG;
    varying vec3 vWorld;

    float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }
    // 雨点落水：网格内随机相位的小圆环
    float splash(vec2 p, float scale, float speed, out vec2 dir){
      vec2 cp = p*scale;
      vec2 cell = floor(cp), f = fract(cp);
      vec2 o = vec2(hash21(cell+3.1), hash21(cell+11.7))*0.7+0.15;
      float ph = hash21(cell+7.3);
      float life = fract(uTime*speed + ph);
      vec2 dv = f-o; float d = length(dv);
      dir = dv/max(d,1e-4);
      float r = life*0.42;
      return smoothstep(0.075,0.0,abs(d-r)) * (1.0-life)*(1.0-life);
    }
    // 街灯 / 店面光在地面上的光池
    vec3 pool(vec2 p, vec2 lp, vec3 c, float inten, float rad){
      float d = length(p-lp);
      float f = max(0.0, 1.0 - d/rad);
      return c * inten * f*f;
    }
    void main(){
      vec3 albedo = texture2D(uGround, vUvG).rgb;
      float mask = texture2D(uPuddle, vUvG).r;
      vec2 p = vWorld.xz;

      vec3 lit = vec3(0.20,0.25,0.36)*1.30;
      lit += vec3(0.26,0.34,0.55)*0.72;
      lit += pool(p, vec2(5.05,4.35), vec3(0.60,0.78,1.00), 2.4, 7.0);
      lit += pool(p, vec2(-3.2,1.70), vec3(1.00,0.70,0.38), 2.0, 7.5);
      lit += pool(p, vec2(-0.3,1.70), vec3(1.00,0.76,0.46), 1.7, 4.5);
      lit += pool(p, vec2(-5.6,2.30), vec3(1.00,0.32,0.46), 1.5, 4.2);
      lit += pool(p, vec2(-9.5,-1.60), vec3(1.00,0.68,0.40), 1.0, 3.6);
      lit += pool(p, vec2(8.60,9.40), vec3(0.35,0.90,0.50), 0.5, 4.0);
      lit += pool(p, vec2(-6.60,7.85), vec3(0.55,0.70,1.00), 1.5, 6.0);
      lit += pool(p, vec2(3.80,-3.60), vec3(0.85,0.72,0.50), 0.8, 5.0);
      lit += pool(p, vec2(11.80,1.00), vec3(0.40,0.85,0.95), 0.9, 4.5);
      lit += pool(p, vec2(-8.50,9.60), vec3(1.00,0.35,0.55), 0.9, 4.5);
      vec3 base = albedo * lit;

      vec2 d1,d2;
      float s1 = splash(p, 2.6, 1.35, d1);
      float s2 = splash(p+17.3, 4.4, 1.9, d2);
      float rings = s1*0.85 + s2*0.5;

      // 屋檐滴水激起的大涟漪
      float bigRing = 0.0; vec2 bigDir = vec2(0.0);
      for(int i=0;i<${RIPPLE_N};i++){
        vec4 R = uRipples[i];
        float age = uTime - R.z;
        if(R.w > 0.0 && age > 0.0 && age < 2.4){
          vec2 dv = p - R.xy;
          float d = length(dv);
          float r = age*1.5;
          float w = 0.10 + age*0.10;
          float ring = smoothstep(w,0.0,abs(d-r)) * (1.0-age/2.4);
          ring += smoothstep(w*0.6,0.0,abs(d-r*0.62)) * (1.0-age/2.4)*0.5;
          bigRing += ring*R.w;
          bigDir += (dv/max(d,1e-4))*ring*R.w;
        }
      }

      vec2 wob = vec2(vnoise(p*2.2+uTime*0.22), vnoise(p*2.2+31.7-uTime*0.17))-0.5;
      vec2 distort = wob*0.010*mask + d1*s1*0.030 + d2*s2*0.018 + bigDir*0.045;

      vec2 uvR = vProj.xy/max(vProj.w,1e-4) + distort;
      vec3 refl = texture2D(tDiffuse, uvR).rgb;
      refl += texture2D(tDiffuse, uvR+vec2(0.0,0.006)).rgb*0.6;
      refl += texture2D(tDiffuse, uvR-vec2(0.0,0.009)).rgb*0.4;
      refl /= 2.0;

      float amt = clamp(mask*0.95, 0.0, 0.95);
      vec3 col = base*(1.0-amt*0.62) + refl*amt;
      col += vec3(0.42,0.58,0.78) * rings * (0.10+mask*0.34);
      col += vec3(0.55,0.72,0.95) * bigRing * 0.32;
      // 水面轻微高光
      col += vec3(0.05,0.08,0.12) * mask * (0.5+0.5*vnoise(p*7.0+uTime*0.6));

      float fd = length(vWorld - cameraPosition);
      float fogF = 1.0 - exp(-uFogDensity*uFogDensity*fd*fd);
      col = mix(col, uFogColor, clamp(fogF,0.0,1.0));
      gl_FragColor = vec4(col, 1.0);
    }`
};

function arcPts(cx,cz,r,a0,a1,n=8){
  const out=[]; for(let i=0;i<=n;i++){ const a=lerp(a0,a1,i/n); out.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); } return out;
}
function curbRun(pts, h=0.17, w=0.26, mat=MATS.curb){
  for(let i=0;i<pts.length-1;i++){
    const [x0,z0]=pts[i], [x1,z1]=pts[i+1];
    const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz);
    if(len<1e-4) continue;
    B(mat, len+w, h, w, (x0+x1)/2, h/2+0.02, (z0+z1)/2, -Math.atan2(dz,dx));
  }
}

function drainGrate(x,z,w,d,ry=0){
  B(MATS.metalDark, w, 0.06, d, x, 0.05, z, ry);
  const n = Math.max(3, Math.round((w>d?w:d)/0.22));
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n-0.5;
    if(w>d) B(MATS.rubber, 0.10, 0.07, d*0.78, x+t*w, 0.055, z, ry);
    else    B(MATS.rubber, w*0.78, 0.07, 0.10, x, 0.055, z+t*d, ry);
  }
}

function curtainWall(axis, fixed, a0, a1, panels){
  // axis 'z' = 前立面（沿 x 展开）; 'x' = 东立面（沿 z 展开）
  const w = (a1-a0)/panels;
  for(let i=0;i<panels;i++){
    const c = a0 + w*(i+0.5);
    if(axis==='z'){
      gbatch.box(MATS.glass, w-0.10, GLASS_TOP-GLASS_BOT, 0.05, c, (GLASS_TOP+GLASS_BOT)/2, fixed, 0, {cast:false, recv:false, layer:LAYER_GLASS});
      B(MATS.metal, 0.10, GLASS_TOP-GLASS_BOT+0.1, 0.13, a0+w*i, (GLASS_TOP+GLASS_BOT)/2, fixed);
    } else {
      gbatch.box(MATS.glass, 0.05, GLASS_TOP-GLASS_BOT, w-0.10, fixed, (GLASS_TOP+GLASS_BOT)/2, c, 0, {cast:false, recv:false, layer:LAYER_GLASS});
      B(MATS.metal, 0.13, GLASS_TOP-GLASS_BOT+0.1, 0.10, fixed, (GLASS_TOP+GLASS_BOT)/2, a0+w*i);
    }
  }
  if(axis==='z') B(MATS.metal, 0.10, GLASS_TOP-GLASS_BOT+0.1, 0.13, a1, (GLASS_TOP+GLASS_BOT)/2, fixed);
  else B(MATS.metal, 0.13, GLASS_TOP-GLASS_BOT+0.1, 0.10, fixed, (GLASS_TOP+GLASS_BOT)/2, a1);
}

  fan.position.set(-0.12*scale,0.02*scale,0.25*scale); g.add(fan);
  const cap = new THREE.Mesh(BOX, MATS.metal); cap.scale.set(0.99*scale,0.05*scale,0.46*scale);

  storeGroup.add(g);
  ANIM.push((t,dt)=>{ fan.rotation.z += dt*(2.2+Math.sin(t*0.5)*0.4); });

}

function gondola(z, x0, x1){
  const len = x1-x0, cx=(x0+x1)/2, h=1.58, d=0.86;
  IB(MATS.iShelf, len, 0.16, d, cx, FLOOR+0.08, z);
  IB(MATS.iShelfEdge, len, h, 0.07, cx, FLOOR+h/2, z);
  IB(MATS.iShelf, 0.07, h, d, x0, FLOOR+h/2, z);
  IB(MATS.iShelf, 0.07, h, d, x1, FLOOR+h/2, z);
  IB(MATS.iShelf, len, 0.06, d, cx, FLOOR+h, z);
  for(let s=0;s<3;s++){
    const sy = FLOOR+0.42+s*0.40;
    IB(MATS.iShelf, len-0.1, 0.04, d-0.06, cx, sy, z);
    for(const side of [-1,1]){
      const gz = z + side*(d/2-0.19);
      IB(MATS.iYellow, len-0.14, 0.055, 0.02, cx, sy+0.045, z+side*(d/2-0.02));
      const n = Math.floor(len/0.20);
      for(let i=0;i<n;i++){
        const px = x0+0.14+i*(len-0.24)/n;
        const bh = srr(0.16,0.28), bw = srr(0.11,0.17);
        IB(pick(), bw, bh, srr(0.10,0.16), px, sy+0.02+bh/2, gz, srr(-0.06,0.06));
      }
    }
  }
  // 端头促销堆头
  for(const ex of [x0-0.34, x1+0.34]){
    IB(MATS.iShelf, 0.6, 0.9, 0.7, ex, FLOOR+0.45, z);
    for(let i=0;i<8;i++){
      IB(pick(), 0.16,0.12,0.16, ex-0.18+(i%3)*0.18, FLOOR+0.96+Math.floor(i/3)*0.13, z-0.16+Math.floor(i/3)*0.02+(i%2)*0.2);
    }
    IPLN(MATS.mPoster2, 0.44, 0.30, ex, FLOOR+1.42, z, null, {cast:false});
    ICYL(MATS.iMetal,0.015,0.015,0.5, ex, FLOOR+1.15, z, 6);
  }
}

function strut(bt, mat, a, b, r, seg=6, opt){
  const A=new THREE.Vector3(a[0],a[1],a[2]), Bp=new THREE.Vector3(b[0],b[1],b[2]);
  const d=new THREE.Vector3().subVectors(Bp,A); const len=d.length();
  if(len<1e-5) return;
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
  const e=new THREE.Euler().setFromQuaternion(q);
  bt.add(new THREE.CylinderGeometry(r,r,len,seg), mat, [(A.x+Bp.x)/2,(A.y+Bp.y)/2,(A.z+Bp.z)/2], [e.x,e.y,e.z], null, opt);
}
const ST = (mat,a,b,r,seg=6,opt)=>strut(batch,mat,a,b,r,seg,opt);

const winMatCache = new Map();
function winMat(rx, ry){
  const key = rx+'_'+ry;
  if(winMatCache.has(key)) return winMatCache.get(key);
  const t = TEX.windows.clone(); t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  const m = toon('mWin'+key, 0xffffff, {map:t, grad:GRAD3, emissive:0xffffff, ei:0.34});
  m.emissiveMap = t;
  winMatCache.set(key, m);
  return m;
}

const RAIN_H = 17.0, RAIN_N = 2400;
{
  const pos = new Float32Array(RAIN_N*2*3);
  const end = new Float32Array(RAIN_N*2);
  const spd = new Float32Array(RAIN_N*2);
  const len = new Float32Array(RAIN_N*2);
  const pha = new Float32Array(RAIN_N*2);
  for(let i=0;i<RAIN_N;i++){
    const x = srr(-14.5,14.5), z = srr(-14.5,14.5), y = srr(0,RAIN_H);
    const s = srr(9.5,15.0), l = srr(0.30,0.85), p = srr(0,RAIN_H);
    for(let k=0;k<2;k++){
      const j=i*2+k;
      pos[j*3]=x; pos[j*3+1]=y; pos[j*3+2]=z;
      end[j]=k; spd[j]=s; len[j]=l; pha[j]=p;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aEnd', new THREE.BufferAttribute(end,1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(spd,1));
  g.setAttribute('aLen', new THREE.BufferAttribute(len,1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(pha,1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,8,0), 30);
  const rainMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms:{ uTime:{value:0}, uH:{value:RAIN_H}, uOpacity:{value:0.22} },
    vertexShader:/* glsl */`
      attribute float aEnd; attribute float aSpeed; attribute float aLen; attribute float aPhase;
      uniform float uTime; uniform float uH;
      varying float vA; varying vec3 vC;
      float roofH(vec2 p){
        float h = 0.0;
        if(p.x>-8.35 && p.x<1.95 && p.y>-7.35 && p.y<1.05) h = 5.25;
        if(p.x>-8.55 && p.x<2.15 && p.y>=1.05 && p.y<2.50) h = max(h,3.40);
        if(p.x<-11.30 && p.y<3.65) h = max(h,4.75);
        if(p.y<-11.80 && p.x<6.30) h = max(h,4.35);
        if(p.y<-12.10 && p.x>=6.30) h = max(h,3.15);
        if(p.y>10.55 && p.x<6.10) h = max(h,3.55);
        if(p.y>10.60 && p.x>=11.10) h = max(h,3.15);
        if(p.x>12.30 && p.y<-5.90 && p.y>-12.10) h = max(h,3.35);
        if(p.x>12.30 && p.y<-0.90 && p.y<3.30) h = max(h,2.75);
        return h;
      }
      void main(){
        float y = mod(position.y - uTime*aSpeed + aPhase, uH);
        float k = 0.055;
        vec3 p = vec3(position.x + k*(uH-y), y, position.z + k*0.45*(uH-y));
        vec3 dir = normalize(vec3(k,-1.0,k*0.45));
        p -= dir*aLen*aEnd;
        float rh = roofH(p.xz);
        float a = smoothstep(0.0,1.2,y) * (1.0-smoothstep(uH-3.5,uH,y));
        a *= step(rh+0.05, y);
        float edge = max(abs(p.x),abs(p.z));
        a *= 1.0-smoothstep(12.2,14.2,edge);
        vA = a;
        // 灯光染色：店前暖光 / 路灯冷光 / 贩卖机粉光
        float warm = exp(-length(vec2(p.x+3.0,(p.z-1.8)*1.4))*0.30) * (1.0-smoothstep(2.0,7.0,y));
        float lamp = exp(-length(vec2(p.x-5.0,(p.z-4.3)*1.2))*0.34) * (1.0-smoothstep(3.0,8.0,y));
        float vend = exp(-length(vec2(p.x+5.6,(p.z-2.2)*1.5))*0.55) * (1.0-smoothstep(1.0,4.5,y));
        vec3 c = vec3(0.50,0.66,0.92);
        c = mix(c, vec3(1.0,0.82,0.55), clamp(warm,0.0,0.85));
        c = mix(c, vec3(0.78,0.90,1.0), clamp(lamp,0.0,0.8));
        c = mix(c, vec3(1.0,0.45,0.62), clamp(vend,0.0,0.7));
        vC = c;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
      }`,
    fragmentShader:/* glsl */`
      uniform float uOpacity; varying float vA; varying vec3 vC;
      void main(){ if(vA<=0.001) discard; gl_FragColor = vec4(vC, vA*uOpacity); }`
  });
  const rain = new THREE.LineSegments(g, rainMat);
  rain.layers.set(LAYER_RAIN); rain.frustumCulled = false; rain.renderOrder = 6;
  scene.add(rain);
  ANIM.push(t=>{ rainMat.uniforms.uTime.value = t; });
}

/* ---- 玻璃上的雨水滑落 ---- */
function glassStreaks(w,h,x,y,z,ry){
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, fog:false,
    uniforms:{ uTime:{value:0}, uSize:{value:new THREE.Vector2(w,h)}, uOpacity:{value:0.55} },
    vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:/* glsl */`
      uniform float uTime; uniform vec2 uSize; uniform float uOpacity; varying vec2 vU;
      float h21(vec2 p){ p=fract(p*vec2(127.31,311.7)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      void main(){
        vec2 uv = vU*uSize;
        float a = 0.0;
        for(int i=0;i<3;i++){
          float fi=float(i);
          float cols = 5.0 + fi*4.0;
          float xx = uv.x*cols;
          float ci = floor(xx), fx = fract(xx);
          float sp = 0.055 + h21(vec2(ci,fi))*0.20;
          float ph = h21(vec2(ci+3.7,fi*2.1));
          float t = fract(uTime*sp + ph);
          float y = (1.0-t)*(uSize.y+0.8)-0.4;
          float wob = sin(uv.y*5.5 + ci*2.3 + uTime*0.5)*0.10;
          float cx = 0.5 + wob;
          float d = length(vec2(fx-cx, (uv.y-y)*1.7));
          float head = 1.0-smoothstep(0.03,0.17,d);
          float tl = 0.4 + h21(vec2(ci,fi+9.0))*1.6;
          float above = uv.y-y;
          float trail = (1.0-smoothstep(0.012,0.055,abs(fx-cx))) * step(0.0,above) * (1.0-smoothstep(0.0,tl,above));
          trail *= 0.30+0.30*sin(above*26.0+ci*3.0);
          a += head*0.85 + max(trail,0.0);
        }
        vec2 gp = uv*20.0; vec2 gi=floor(gp), gf=fract(gp);
        float hh = h21(gi);
        if(hh>0.70){
          float d = length(gf-vec2(h21(gi+1.3),h21(gi+5.1)));
          a += (1.0-smoothstep(0.06,0.24,d))*0.30;
        }
        a = clamp(a,0.0,1.4);
        gl_FragColor = vec4(vec3(0.70,0.85,1.0), a*uOpacity);
      }`
  });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
  p.position.set(x,y,z); p.rotation.y = ry;
  p.layers.set(LAYER_GLASS); p.renderOrder = 5;
  scene.add(p);
  ANIM.push(t=>{ m.uniforms.uTime.value = t; });
}

   11. 三渲二描边 + 后期
   ============================================================ */
let EW = Math.max(2, Math.floor(VW() * renderer.getPixelRatio() * 0.75));
let EH = Math.max(2, Math.floor(VH() * renderer.getPixelRatio() * 0.75));
const depthTex = new THREE.DepthTexture(EW, EH);
depthTex.type = THREE.UnsignedIntType;
const edgeRT = new THREE.WebGLRenderTarget(EW, EH, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  type: THREE.UnsignedByteType, depthTexture: depthTex, depthBuffer: true, stencilBuffer: false
});
const normalMat = new THREE.MeshNormalMaterial();
const edgeCam = camera;

function renderEdgePass(){
  const clearColor = renderer.getClearColor(new THREE.Color());
  const clearAlpha = renderer.getClearAlpha();
  reflector.visible = false;
  shadowCatcher.visible = false;
  scene.overrideMaterial = normalMat;
  edgeCam.layers.set(LAYER_SOLID);
  renderer.setRenderTarget(edgeRT);
  renderer.setClearColor(0x8080ff, 1);
  renderer.clear();
  renderer.render(scene, edgeCam);
  renderer.setRenderTarget(null);
  renderer.setClearColor(clearColor, clearAlpha);
  scene.overrideMaterial = null;
  edgeCam.layers.enable(LAYER_GLASS);
  edgeCam.layers.enable(LAYER_RAIN);
  reflector.visible = true;
  shadowCatcher.visible = true;
}

const EdgeGrade = {
  uniforms: {
    tDiffuse: {value:null}, tNormal: {value:edgeRT.texture}, tDepth: {value:depthTex},
    uRes: {value:new THREE.Vector2(EW,EH)}, uNear:{value:camera.near}, uFar:{value:camera.far},
    uStrength: {value:0.92}, uTime: {value:0}, uAspect: {value:VW()/VH()}
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse, tNormal, tDepth;
    uniform vec2 uRes; uniform float uNear, uFar, uStrength, uTime, uAspect;
    varying vec2 vUv;
    float lin(float d){ float z=d*2.0-1.0; return (2.0*uNear*uFar)/(uFar+uNear-z*(uFar-uNear)); }
    float h21(vec2 p){ p=fract(p*vec2(127.31,311.7)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
    float edgeAt(vec2 off, float d0, vec3 n0){
      vec2 uv = vUv + off/uRes;
      float di = lin(texture2D(tDepth, uv).x);
      vec3 ni = texture2D(tNormal, uv).xyz*2.0-1.0;
      float dd = abs(di-d0)/max(min(di,d0),0.001);
      float e = smoothstep(0.016,0.055,dd);
      float ne = smoothstep(0.42,0.86, 1.0-max(dot(normalize(n0),normalize(ni)),0.0));
      return max(e, ne*(1.0-smoothstep(0.03,0.09,dd)));
    }
    void main(){
      float d0 = lin(texture2D(tDepth, vUv).x);
      vec3 n0 = texture2D(tNormal, vUv).xyz*2.0-1.0;
      float e = 0.0;
      e = max(e, edgeAt(vec2( 1.15, 0.0), d0, n0));
      e = max(e, edgeAt(vec2(-1.15, 0.0), d0, n0));
      e = max(e, edgeAt(vec2( 0.0, 1.15), d0, n0));
      e = max(e, edgeAt(vec2( 0.0,-1.15), d0, n0));
      e *= 1.0 - smoothstep(40.0, 88.0, d0);
      e = clamp(e,0.0,1.0)*uStrength;

      vec2 dir = vUv-0.5;
      float r2 = dot(dir,dir);
      float ca = 0.0016*r2;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + dir*ca).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - dir*ca).b;

      vec3 ink = col*0.13 + vec3(0.010,0.016,0.032);
      col = mix(col, ink, e);

      // 暗部偏蓝，保持夜景层次
      float luma = dot(col, vec3(0.299,0.587,0.114));
      col += vec3(0.004,0.009,0.020)*(1.0-smoothstep(0.0,0.35,luma));
      // 暗角
      float vig = 1.0 - smoothstep(0.30, 1.05, length(dir*vec2(uAspect,1.0))*1.18);
      col *= mix(0.62, 1.0, vig);
      // 胶片颗粒
      col += (h21(vUv*uRes + fract(uTime)*137.0)-0.5)*0.020;
      gl_FragColor = vec4(max(col,0.0), 1.0);
    }`
};

// 合成缓冲不开 MSAA：UnrealBloomPass 会加色混合回 readBuffer，
// 多重采样缓冲在 resolve 后被 invalidate，会导致整屏变黑（部分驱动上必现）。
const rtParams = {type: THREE.HalfFloatType};
const composerRT = new THREE.WebGLRenderTarget(
  Math.max(2, Math.floor(VW()*renderer.getPixelRatio())), Math.max(2, Math.floor(VH()*renderer.getPixelRatio())), rtParams);
const composer = new EffectComposer(renderer, composerRT);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(VW(), VH()), 0.46, 0.60, 0.94);
composer.addPass(bloom);
const edgePass = new ShaderPass(EdgeGrade);
edgePass.uniforms.tNormal.value = edgeRT.texture;
edgePass.uniforms.tDepth.value = depthTex;
composer.addPass(edgePass);
composer.addPass(new OutputPass());
const smaa = new SMAAPass(VW()*renderer.getPixelRatio(), VH()*renderer.getPixelRatio());
composer.addPass(smaa);

/* ============================================================
   12. 交互 / 自适应 / 渲染循环
   ============================================================ */
controls.enablePan = false;
let lastInteract = -999, interacting = false;
controls.addEventListener('start', ()=>{ interacting=true; controls.autoRotate=false; });
controls.addEventListener('end', ()=>{ interacting=false; lastInteract=_elapsed; });
canvas.addEventListener('wheel', ()=>{ lastInteract=_elapsed; controls.autoRotate=false; }, {passive:true});

function resize(){
  const w = VW(), h = VH();
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  const pr = renderer.getPixelRatio();
  composer.setPixelRatio(pr);
  composer.setSize(w,h);
  EW = Math.max(2, Math.floor(w*pr*edgeScale));
  EH = Math.max(2, Math.floor(h*pr*edgeScale));
  edgeRT.setSize(EW,EH);
  edgePass.uniforms.uRes.value.set(EW,EH);
  edgePass.uniforms.uAspect.value = w/h;
}
let edgeScale = 0.75;
addEventListener('resize', resize);
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(document.documentElement);
resize();

// 画质自适应
let qualityTier = 0, fpsAcc = 0, fpsFrames = 0, lowStreak = 0;
let reflectEvery = 1, frameId = 0;
const reflectorRender = reflector.onBeforeRender;
reflector.onBeforeRender = function(r, s, c, g, m, gr){
  if(frameId % reflectEvery !== 0) return;
  reflectorRender.call(this, r, s, c, g, m, gr);
};
function degrade(){
  qualityTier++;
  if(qualityTier===1){
    renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.15));
    edgeScale = 0.6; reflectEvery = 2; resize();
  } else if(qualityTier===2){
    renderer.setPixelRatio(1);
    edgeScale = 0.5; reflectEvery = 3;
    bloom.strength = 0.45; resize();
  }
}

const clock = new THREE.Clock();
const introFrom = camera.position.clone();
let introT = 0, baked = 0;
renderer.shadowMap.autoUpdate = true;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  _elapsed += dt;
  frameId++;
  renderer.info.reset();

  if(introT < 1){
    introT = Math.min(1, introT + dt/3.2);
    const e = 1-Math.pow(1-introT, 3);
    camera.position.lerpVectors(introFrom, HOME, e);
    if(introT>=1) controls.autoRotate = true;
  } else if(!interacting && _elapsed-lastInteract > 6){
    controls.autoRotate = true;
  }
  controls.update();

  for(let i=0;i<ANIM.length;i++) ANIM[i](_elapsed, dt);
  reflector.material.uniforms.uTime.value = _elapsed;
  edgePass.uniforms.uTime.value = _elapsed;

  renderEdgePass();
  composer.render();

  if(baked < 4){ baked++; if(baked===4) renderer.shadowMap.autoUpdate = false; }

  fpsAcc += dt; fpsFrames++;
  if(fpsAcc >= 1.2){
    const fps = fpsFrames/fpsAcc;
    if(fps < 42 && qualityTier < 2){ lowStreak++; if(lowStreak>=2){ degrade(); lowStreak=0; } }
    else lowStreak = 0;
    fpsAcc = 0; fpsFrames = 0;
  }
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) clock.getDelta(); });
canvas.addEventListener('webglcontextlost', e=>{ e.preventDefault(); });

// 首帧渲染后淡入
renderEdgePass();
composer.render();
requestAnimationFrame(()=>canvas.classList.add('on'));
tick();

window.__diorama = {renderer, scene, camera, controls, composer, ANIM, tick, bloom, edgePass, smaa, reflector,
  seek:(t)=>{ _elapsed=t; introT=1; lastInteract=t; camera.position.copy(HOME); controls.autoRotate=false; controls.update(); },
  stats:()=>({calls:renderer.info.render.calls, tris:renderer.info.render.triangles, tier:qualityTier,
    programs:renderer.info.programs.length, textures:renderer.info.memory.textures, geometries:renderer.info.memory.geometries})};
</script>
</body>
</html>
