{"title": "IWPhone：从 PC 工具箱到免 root 模块管理器", "url": "/2026/10/25/iwphone/", "date": "2026-10-25", "tags": ["安卓","工具"], "content": "<p>IWPhone 是我做得最久的一条线，从最早的安卓端工具箱，扩展成了现在的三块：PC 端工具箱、免 root 模块管理器，以及一个跑在浏览器里的网页版。</p>\n\n<p>三者的共同点是：<strong>尽量不依赖电脑、不依赖 root，把玩机的门槛降下来。</strong></p>\n\n<h2 id=\"iwphone-toolboxpc-端\">IWPhone Toolbox：PC 端</h2>\n\n<p><a href=\"https://github.com/haothtrteen/IWPhone\">IWPhone</a> 是基于 WPF（C#）写的桌面工具箱，主要解决”手机上不好操作、电脑上更顺手”的那部分工作。它不是一个单点工具，而是把玩机过程中零散的操作收进一个界面：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>模块</th>\n      <th>能力</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>设备信息</td>\n      <td>型号、品牌、系统版本（Android / MIUI / ColorOS）、内核、内存与存储、电池健康度</td>\n    </tr>\n    <tr>\n      <td>投屏</td>\n      <td>基于 scrcpy 的电脑投手机，支持鼠标键盘反向控制；手机投电脑可作副屏</td>\n    </tr>\n    <tr>\n      <td>驱动与依赖</td>\n      <td>自动识别 ADB / 厂商驱动，一键安装修复；自动拉取 Fastboot、Magisk 工具包</td>\n    </tr>\n    <tr>\n      <td>应用管理</td>\n      <td>APK 安装卸载、含私有目录的整包备份与还原、系统预装应用的冻结与精简</td>\n    </tr>\n    <tr>\n      <td>插件仓库</td>\n      <td>基于 C# MEF 的动态插件加载，字体替换、主题美化这类功能都做成插件</td>\n    </tr>\n    <tr>\n      <td>安全工具</td>\n      <td>Bootloader 解锁引导、第三方 Recovery 刷入、恶意软件与漏洞扫描</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>技术上是 WPF + C# 通过 ADB 协议和设备通信，功能按插件拆分，启用或禁用互不影响。官方给的支持范围是 Android 5.1 ~ 14 与 Windows 10 ~ 11。</p>\n\n<h2 id=\"iwphonemodules免-root-模块管理器\">IwphoneModules：免 root 模块管理器</h2>\n\n<p><a href=\"https://github.com/haothtrteen/IwphoneModules\">IwphoneModules</a> 解决的是另一个问题：想做系统级调整（省电、性能调度、动画调速、隐私开关），传统路径是 Root + Magisk，但门槛高、有风险、影响保修。</p>\n\n<p>它通过系统自带的「无线调试」拿到 shell 权限，再配一套运行时来跑免 root 模块。三块能力：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>能力</th>\n      <th>说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>自持 adb</td>\n      <td>应用内捆绑 adb 二进制，自己配对、自己连接，全程不需要电脑</td>\n    </tr>\n    <tr>\n      <td>模块运行时</td>\n      <td>启停、冲突检测、沙箱记账、配置、日志、开机自启</td>\n    </tr>\n    <tr>\n      <td>兜底机制</td>\n      <td>写前快照，记下原值，一键还原到改动之前</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3 id=\"全程在手机里完成的引导\">全程在手机里完成的引导</h3>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>① 配对设备    通知栏输入配对码（端口由 mDNS 自动发现，不用手抄）\n② 部署框架    App 内置框架包，一键部署 / 修复 / 重置\n③ 设置访问密钥  自己设一把密钥（WebUI 鉴权，APatch 式）\n        ↓\n   框架运行 → 装模块 → 管理\n</code></pre></div></div>\n\n<p>配对端口用 mDNS 自动发现，连接端口固定在 <code class=\"language-plaintext highlighter-rouge\">persist.adb.tcp.port=5555</code>，跨重启保持，配合 <code class=\"language-plaintext highlighter-rouge\">BOOT_COMPLETED</code> 与 JobScheduler 做开机自启。App 用 <code class=\"language-plaintext highlighter-rouge\">jniLibs</code> 的技巧自带 adb 二进制，绕开 Android 对应用数据目录 <code class=\"language-plaintext highlighter-rouge\">noexec</code> 的限制。</p>\n\n<h3 id=\"兼容-magisk-式模块\">兼容 Magisk 式模块</h3>\n\n<p>Magisk / KernelSU / AxManager 的模块结构基本一致，安装时会自动适配：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>原框架概念</th>\n      <th>本框架的处理</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code class=\"language-plaintext highlighter-rouge\">module.prop</code></td>\n      <td>生成等价元信息（含 <code class=\"language-plaintext highlighter-rouge\">runtime=0</code> 标记常驻）</td>\n    </tr>\n    <tr>\n      <td><code class=\"language-plaintext highlighter-rouge\">service.sh</code></td>\n      <td>生成兼容入口，接进启动流程</td>\n    </tr>\n    <tr>\n      <td><code class=\"language-plaintext highlighter-rouge\">post-fs-data.sh</code></td>\n      <td>启动时尽力执行，语义差异在文档里标明</td>\n    </tr>\n    <tr>\n      <td><code class=\"language-plaintext highlighter-rouge\">action.sh</code> / <code class=\"language-plaintext highlighter-rouge\">uninstall.sh</code></td>\n      <td>原样支持</td>\n    </tr>\n    <tr>\n      <td><code class=\"language-plaintext highlighter-rouge\">webroot/</code> 每模块 WebUI</td>\n      <td>按 <code class=\"language-plaintext highlighter-rouge\">/mod/&lt;模块名&gt;/</code> 提供，注入同构的 <code class=\"language-plaintext highlighter-rouge\">ksu</code> 桥</td>\n    </tr>\n    <tr>\n      <td>BusyBox applet 假设</td>\n      <td>自带 BusyBox（358 个 applet），PATH 优先指向它</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>明确不支持的是 systemless 挂载、Zygisk / 内核模块、需要 <code class=\"language-plaintext highlighter-rouge\">su</code> 的模块——这些在免 root 环境里物理上做不到。安装前会预检并给出判定：预计兼容 / 需要 Root / 无法判断。</p>\n\n<h3 id=\"写前快照\">写前快照</h3>\n\n<p>免 root 玩机最怕的不是”没效果”，而是<strong>改坏了回不去</strong>。框架在沙箱的写操作拦截点上多做了一步：首次写某个系统资源前，记录它的原值。</p>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>$IWPHONE_ROOT/modsnap/&lt;模块名&gt;.snap\nsettings put global window_animation_scale '1.0'   # [global.window_animation_scale]\n</code></pre></div></div>\n\n<p>每行本身就是一条可直接执行的还原命令。点「还原」时会先展示清单（当前值 → 还原值），确认后<strong>先停模块再还原</strong>——常驻模块的守卫循环会把值改回去，不停模块等于白还原。</p>\n\n<p>卸载模块不会删除快照，所以模块可以卸，它改过的设置仍能还原。</p>\n\n<h2 id=\"webiwphone网页版\">webiwphone：网页版</h2>\n\n<p>最早的那批页面（<code class=\"language-plaintext highlighter-rouge\">webadb.html</code>、<code class=\"language-plaintext highlighter-rouge\">appops.html</code>、<code class=\"language-plaintext highlighter-rouge\">iwhl.html</code>）原本挂在这个域名下，纯前端实现，用 WebUSB 连接设备。现在这部分已经迁到 IWPhone 仓库的 <code class=\"language-plaintext highlighter-rouge\">webiwphone/</code> 目录里，和 PC 端放在一起维护。</p>\n\n<p>三条线各有分工：桌面端管复杂度高的操作，模块管理器管需要持续运行的调整，网页版管”随手打开就能用”的场景。</p>\n\n<h2 id=\"相关链接\">相关链接</h2>\n\n<ul>\n  <li>仓库：<a href=\"https://github.com/haothtrteen/IWPhone\">haothtrteen/IWPhone</a></li>\n  <li>原始 README：<a href=\"https://github.com/haothtrteen/IWPhone/blob/main/README.md\">IWPhone/README.md</a></li>\n  <li>模块管理器仓库：<a href=\"https://github.com/haothtrteen/IwphoneModules\">haothtrteen/IwphoneModules</a></li>\n</ul>\n"},

{"title": "FOA：在手机上写 Flutter，直接打出 APK", "url": "/2026/10/24/foaide/", "date": "2026-10-24", "tags": ["Flutter","开发工具"], "content": "<p><a href=\"https://github.com/haothtrteen/FOAIDE\">FOAIDE</a>（Flutter on Android IDE）想验证一件事：<strong>不带电脑，能不能把 Flutter 应用从写代码一路做到装到手机上。</strong></p>\n\n<p>结论是可以。它不需要 root，也不需要外接设备。</p>\n\n<h2 id=\"为什么这件事本来做不到\">为什么这件事本来做不到</h2>\n\n<p>官方 Flutter <strong>不支持在 Android 上构建 Android 应用</strong>。FOA 用三层把它拼出来：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>层</th>\n      <th>做法</th>\n      <th>为什么需要</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>容器</td>\n      <td>proot + Debian rootfs（免 root）</td>\n      <td>在 Android 上跑完整 Linux 工具链，且不动系统</td>\n    </tr>\n    <tr>\n      <td>工具链</td>\n      <td>设备内安装 Flutter SDK / Android SDK / JDK</td>\n      <td>不依赖电脑，全部落在容器里</td>\n    </tr>\n    <tr>\n      <td>指令翻译</td>\n      <td>QEMU 跑 x64 版 <code class=\"language-plaintext highlighter-rouge\">gen_snapshot</code> / <code class=\"language-plaintext highlighter-rouge\">impellerc</code></td>\n      <td>官方<strong>没有</strong> arm64 版 AOT 工具</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>第三层是真正的难点：Flutter 的 AOT 编译器只提供 x64 版本，arm64 设备上必须靠 QEMU 做指令翻译才能跑通构建。项目开发手册里绝大部分 bug 都来自这一层。</p>\n\n<p>整体结构：</p>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>Android 设备（arm64，无 root）\n  FOA App（Flutter）\n    ├─ 代码编辑器 / 设计器 / 清单编辑\n    ├─ Web 热重载预览（改代码即时看效果）\n    └─ 构建编排 ──┐\n                  │ fork/exec\n  ┌───────────────▼────────────────────────┐\n  │  proot 容器（Debian bookworm arm64）   │\n  │    ├─ Flutter SDK / Dart               │\n  │    ├─ Android SDK / Gradle             │\n  │    └─ 你的工程 → 产出 APK              │\n  └────────────────────────────────────────┘\n</code></pre></div></div>\n\n<h2 id=\"功能\">功能</h2>\n\n<table>\n  <thead>\n    <tr>\n      <th>区域</th>\n      <th>能力</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>工程</td>\n      <td>新建空白模板、导入 zip/tar.gz/tar.xz、导出 tar.gz、git 远端（HTTPS + PAT，只走 <code class=\"language-plaintext highlighter-rouge\">--ff-only</code>）</td>\n    </tr>\n    <tr>\n      <td>编辑</td>\n      <td>语法高亮、自动保存、外部改动自动同步</td>\n    </tr>\n    <tr>\n      <td>设计</td>\n      <td>可视化界面设计器生成 Flutter 代码，也能从已有 UI 反向导入</td>\n    </tr>\n    <tr>\n      <td>清单</td>\n      <td>应用名 / 包名 / 版本 / 权限 / 混淆开关 / 图标替换 / 签名补丁</td>\n    </tr>\n    <tr>\n      <td>构建</td>\n      <td>debug（JIT，快）与 release（AOT，可上架）双模式，实时日志，失败自动分诊</td>\n    </tr>\n    <tr>\n      <td>工具链</td>\n      <td>一键安装 Flutter SDK / Android SDK / JDK / x64 兼容层</td>\n    </tr>\n    <tr>\n      <td>AI</td>\n      <td>内置 LLM 接入（OpenAI 兼容接口）与 MCP 客户端，可把任务派给远端 AI</td>\n    </tr>\n  </tbody>\n</table>\n\n<h2 id=\"上手前要知道的\">上手前要知道的</h2>\n\n<ul>\n  <li>需要一台 <strong>arm64 Android 设备</strong>，Android 10 以上，不需要 root</li>\n  <li>预留约 <strong>8 GB 存储</strong>（SDK + rootfs + 构建缓存）</li>\n  <li>首次要联网下载 SDK，容器内走清华 TUNA 镜像</li>\n  <li>仓库里<strong>不含</strong> 75MB 的 Debian rootfs（体积原因），需要自己用 <code class=\"language-plaintext highlighter-rouge\">debootstrap</code> 构建一次，或向维护者索取</li>\n</ul>\n\n<p>最快的体验路径：</p>\n\n<div class=\"language-bash highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>git clone https://github.com/haothtrteen/FOAIDE\n<span class=\"nb\">cd </span>FOAIDE/app\nbash tools/fetch_assets.sh     <span class=\"c\"># 下载 proot 等未跟踪资产</span>\nflutter pub get\nflutter run <span class=\"nt\">--release</span>          <span class=\"c\"># 装到设备上</span>\n</code></pre></div></div>\n\n<h2 id=\"开发手册才是最有价值的部分\">开发手册才是最有价值的部分</h2>\n\n<p>仓库里的 <code class=\"language-plaintext highlighter-rouge\">dev-handbook/</code> 有 7 篇手册，其中 <code class=\"language-plaintext highlighter-rouge\">04-常见Bug与解决方案.md</code> 记录了 <strong>400+ 个真实踩坑</strong>，每个都有症状、根因、实证过程和修法。如果你也要在 Android 上跑 Flutter 工具链，这里大概率已经有答案。</p>\n\n<p>许可上是 AGPL-3.0 + 商业授权双许可：开源可用，闭源集成需要单独授权。</p>\n\n<h2 id=\"相关链接\">相关链接</h2>\n\n<ul>\n  <li>仓库：<a href=\"https://github.com/haothtrteen/FOAIDE\">haothtrteen/FOAIDE</a></li>\n  <li>原始 README：<a href=\"https://github.com/haothtrteen/FOAIDE/blob/main/README.md\">FOAIDE/README.md</a></li>\n  <li>构建流程：<a href=\"https://github.com/haothtrteen/FOAIDE/blob/main/%E6%9E%84%E5%BB%BA%E6%B5%81%E7%A8%8B.md\">构建流程.md</a></li>\n  <li>踩坑记录：<a href=\"https://github.com/haothtrteen/FOAIDE/blob/main/dev-handbook/04-%E5%B8%B8%E8%A7%81Bug%E4%B8%8E%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88.md\">dev-handbook/04-常见Bug与解决方案.md</a></li>\n</ul>\n"},

{"title": "FDartVMP：让 Flutter 的关键逻辑在 libapp.so 里查无此函数", "url": "/2026/10/23/fdartvmp/", "date": "2026-10-23", "tags": ["Flutter","安全"], "content": "<p>Flutter 应用的逆向门槛一向不高。发布版 Dart 代码经 AOT 编译成 <code class=\"language-plaintext highlighter-rouge\">libapp.so</code>，里面有符号、有常量、有相对完整的控制流，工具链（比如 Blutter）跑一遍就能还原出可读的结构。</p>\n\n<p><a href=\"https://github.com/haothtrteen/FDartVMP\">FDartVMP</a> 要解决的就是这一点：<strong>让指定的 Dart 函数在产物里根本不存在。</strong></p>\n\n<h2 id=\"为什么不能直接套现成的-so-vmp\">为什么不能直接套现成的 SO VMP</h2>\n\n<p><code class=\"language-plaintext highlighter-rouge\">libapp.so</code> 其实不是标准的 NDK 机器码，而是一个 ELF 里装着 <strong>Dart VM 快照</strong>。它没有 <code class=\"language-plaintext highlighter-rouge\">JNI_OnLoad</code> 入口，通用的 SO VMP 或 DEX VMP 工具套上去会破坏快照结构，应用直接起不来。</p>\n\n<p>所以出路不是去混淆快照里的机器码，而是<strong>把敏感逻辑从 Dart 里搬出去</strong>：</p>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>核心算法  ──► 私有字节码  ──► 加密  ──► 嵌入 C 层\n    │                                        │\n    └──► Dart 侧只留一行 stub  ◄── FFI 返回 ◄── 私有 VM 执行\n</code></pre></div></div>\n\n<p>逆向 <code class=\"language-plaintext highlighter-rouge\">libapp.so</code> 的人只能看到一行 stub。真正的逻辑只以字节码形式存在于 native 库中，并且只在一次调用的时间内是明文。</p>\n\n<h2 id=\"编译流水线\">编译流水线</h2>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>protected/*.dart              真正的实现（不在 app 里）\n      │\n      ├── tool/vmpc: 词法 → 语法 → AST → 字节码 → 操作码置换\n      │              → 流加密 → 容器\n      ├── packages/dartvmp/generated/vmp_module.inc  掩码后的 uint64 镜像\n      ├── CMake（Windows 静态链接；Android 出 libdartvmp.so）\n      ├── app/lib/generated/protected_stubs.dart     应用调用的一行 stub\n      └── Dart FFI → C 解释器（dvmp_vm.c）→ 23 个受审计内建函数\n                    └─ 受保护内存：解密 → 执行 → 擦除 → 重新加密\n</code></pre></div></div>\n\n<h2 id=\"为什么没用-dart_eval\">为什么没用 dart_eval</h2>\n\n<p><code class=\"language-plaintext highlighter-rouge\">dart_eval</code> 是个好项目，但它省掉的是编译器，留下的是更难的一半：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th> </th>\n      <th>自研 VM（本仓库）</th>\n      <th>dart_eval</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>编译器</td>\n      <td>约 1200 行 Dart</td>\n      <td>现成</td>\n    </tr>\n    <tr>\n      <td><strong>native 解释器</strong></td>\n      <td>约 700 行 C</td>\n      <td><strong>仍然要自己写</strong></td>\n    </tr>\n    <tr>\n      <td>字节码对 Dart 工具链不可见</td>\n      <td>是，从来不是 Dart 对象</td>\n      <td>否，是 Dart <code class=\"language-plaintext highlighter-rouge\">Program</code></td>\n    </tr>\n    <tr>\n      <td>私有指令集</td>\n      <td>原生实现</td>\n      <td>要 fork 才能改</td>\n    </tr>\n    <tr>\n      <td>结果</td>\n      <td>逻辑真的不在 <code class=\"language-plaintext highlighter-rouge\">libapp.so</code> 里</td>\n      <td>逻辑只是搬家</td>\n    </tr>\n  </tbody>\n</table>\n\n<p><code class=\"language-plaintext highlighter-rouge\">dart_eval</code> 的运行时是纯 Dart，想在 C 层执行它的字节码，等于把 Dart VM 再塞回 C 里——正好是这个设计要避开的东西。所以仓库自己写了一套小指令集和小编译器。</p>\n\n<p>边界留得很干净：只要按 <code class=\"language-plaintext highlighter-rouge\">packages/dartvmp/src/dvmp_wire.h</code> 的指令集输出字节码，就能接上现有运行时，以后想加 <code class=\"language-plaintext highlighter-rouge\">dart_eval</code> 前端也不用重做。</p>\n\n<h2 id=\"闭环验证与挑战\">闭环验证与挑战</h2>\n\n<p>这类项目最容易变成”看起来能用”。所以每一环都在测试里：编译器套件、与 Dart 参考实现做差分对比的应用套件、发布 APK 里目标函数不可见的产物检查，以及真机运行。全部走 <code class=\"language-plaintext highlighter-rouge\">tool/test.ps1 -Release</code>，结果——包括没做成的部分——都写进文档。</p>\n\n<p>仓库还带了一个 CTF 风格的靶子，用的是这个项目最强的配置。规则和预期难度在 <a href=\"https://github.com/haothtrteen/FDartVMP/blob/main/docs/CHALLENGE.md\">docs/CHALLENGE.md</a>。如果绕过了，欢迎告诉我。</p>\n\n<p>授权是 AGPL-3.0-or-later，闭源商业用途需单独授权。</p>\n\n<h2 id=\"相关链接\">相关链接</h2>\n\n<ul>\n  <li>仓库：<a href=\"https://github.com/haothtrteen/FDartVMP\">haothtrteen/FDartVMP</a></li>\n  <li>原始 README：<a href=\"https://github.com/haothtrteen/FDartVMP/blob/main/README.md\">FDartVMP/README.md</a></li>\n  <li>中文文档：<a href=\"https://github.com/haothtrteen/FDartVMP/blob/main/README.zh-CN.md\">README.zh-CN.md</a></li>\n  <li>挑战说明：<a href=\"https://github.com/haothtrteen/FDartVMP/blob/main/docs/CHALLENGE.md\">docs/CHALLENGE.md</a></li>\n</ul>\n"},

{"title": "三个保护工具：ShellVMP、EmojiShell 与 PEA", "url": "/2026/10/22/shell-protection/", "date": "2026-10-22", "tags": ["脚本","安全","工具"], "content": "<p>这三个项目各自解决一小块”保护”问题，侧重点完全不同，放在一起看挺有意思。</p>\n\n<h2 id=\"shellvmp让磁盘上不存在明文\">ShellVMP：让磁盘上不存在明文</h2>\n\n<p><a href=\"https://github.com/haothtrteen/ShellVMP\">ShellVMP</a> 把 shell 脚本编译成自保护产物，分三层，可以独立使用：</p>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>你的脚本 (app.sh)\n      │\n   V6 混淆器（纯 shell）\n      │  分块 → 加密 → 绑链；执行状态掺入密钥链\n      │  跳跃引用第 N-7 块，必须从头跑；解密后重加密\n      ▼\n   骨架（加密脚本）\n      │\n   V7 ELF 封装（C）\n      │  scrypt-like KDF + Encrypt-then-MAC\n      │  父进程分块解密 → pipe → 子进程，明文即写即抹\n      ▼\n   V7-ISA 令牌化（魔改解释器）\n      │  命令名 / 关键字 / 变量名 → 随机别名\n      ▼\n   最终产物：strings 出来只有随机令牌\n</code></pre></div></div>\n\n<p>三层各自的定位：</p>\n\n<ul>\n  <li><strong>V6</strong> 纯 shell 实现的混淆器。零外部依赖，<code class=\"language-plaintext highlighter-rouge\">aes</code> 模式需要 openssl，<code class=\"language-plaintext highlighter-rouge\">builtin</code> 模式纯 shell/awk。</li>\n  <li><strong>V7</strong> ELF 封装层。反调试、反内存读取，流式解密直接喂给解释器，磁盘上没有完整明文。</li>\n  <li><strong>V7-ISA</strong> 解释器魔改层（PoC）。把命令名、关键字、变量名令牌化，让产物在磁盘上只是一串随机令牌。</li>\n</ul>\n\n<p>最小的用法：</p>\n\n<div class=\"language-bash highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>git clone https://github.com/haothtrteen/ShellVMP.git\n<span class=\"nb\">cd </span>ShellVMP\n\n<span class=\"c\"># 混淆一个脚本（非安卓环境加 ANDROID_GATE=0）</span>\n<span class=\"nv\">ANDROID_GATE</span><span class=\"o\">=</span>0 bash v6/shell_script_obfuscator_v6.sh examples/demo_app.sh demo.protected.sh\nbash demo.protected.sh\n</code></pre></div></div>\n\n<p>不绑定平台——产物是 ELF 或纯脚本，Android、桌面 Linux、服务器、容器、嵌入式都能跑。脚本来源上，bash 原生支持，dash / POSIX / zsh 经转译收敛进 bash 线，mksh 有独立的第二打包路线。</p>\n\n<p>它有一个体检工具 <code class=\"language-plaintext highlighter-rouge\">tools/v6_lint.py</code>，混淆前先跑一遍：宿主的 <code class=\"language-plaintext highlighter-rouge\">errexit</code>、<code class=\"language-plaintext highlighter-rouge\">set -x</code>、改 <code class=\"language-plaintext highlighter-rouge\">PS4</code>、重定义 builtin 都会命中产物的反调试指纹，导致主密钥污染后静默退出、零提示。先体检能把这些提前揪出来。</p>\n\n<p>它的目标不是”藏得更深”，而是<strong>改变攻击面</strong>：磁盘无明文，运行期明文窗口尽可能短且有界，关键逻辑变成无法静态分析的虚拟指令。</p>\n\n<h2 id=\"emojishell用-emoji-伪装脚本\">EmojiShell：用 emoji 伪装脚本</h2>\n\n<p><a href=\"https://github.com/haothtrteen/EmojiShell\">EmojiShell</a> 走的是另一条路——视觉迷惑。核心是把敏感代码换成 emoji 组合：</p>\n\n<div class=\"language-plaintext highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code>rm -rf  →  ✂️➡️🚫📁\n</code></pre></div></div>\n\n<p>支持自定义映射表（<code class=\"language-plaintext highlighter-rouge\">🐚=echo</code>、<code class=\"language-plaintext highlighter-rouge\">😈=sudo</code> 这类），运行时自动变换 emoji 形式，还会用 <code class=\"language-plaintext highlighter-rouge\">$RANDOM</code> 生成伪随机 emoji 流干扰静态分析。另外带一个加壳工具，能一键生成混淆后的 <code class=\"language-plaintext highlighter-rouge\">.sh</code>。</p>\n\n<p>实际产物长这样（节选）：</p>\n\n<div class=\"language-bash highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code><span class=\"c\">#!/usr/bin/env zsh</span>\n🍒🎋🌍🍎🍒🚁🌛🐸🐸💞🍒💚<span class=\"o\">()</span> <span class=\"o\">{</span> <span class=\"nb\">printf</span> <span class=\"s2\">\"%s\"</span> <span class=\"s2\">\"0\"</span><span class=\"p\">;</span> <span class=\"o\">}</span><span class=\"p\">;</span>🐝🔥🐯🍆💚🐣🍒💗🖤🐗🌟💗<span class=\"o\">()</span> <span class=\"o\">{</span> <span class=\"nb\">printf</span> <span class=\"s2\">\"%s\"</span> <span class=\"s2\">\"1\"</span><span class=\"p\">;</span> <span class=\"o\">}</span><span class=\"p\">;</span>\n</code></pre></div></div>\n\n<p>它对运行环境有要求：需要 zsh 或 ksh（<code class=\"language-plaintext highlighter-rouge\">sudo apt install zsh</code>），并在产物首行加上对应的 shebang。</p>\n\n<p>严肃说，它的防护强度远不如 ShellVMP，不适合保护真正的敏感逻辑。但它把”代码可以长成什么样”这件事做得很好玩，也适合当教学素材——让人直观理解为什么单纯的字符替换不构成有效保护。</p>\n\n<h2 id=\"pea把加固变成可验证的流程\">PEA：把加固变成可验证的流程</h2>\n\n<p><a href=\"https://github.com/haothtrteen/PEA\">PEA</a>（Protective Engineering Assistant）的出发点是个很实际的问题：</p>\n\n<blockquote>\n  <p>这个二进制里到底暴露了什么？该加固哪些？怎么证明加固真的生效了？</p>\n</blockquote>\n\n<p>它的答案是用工程闭环来回答，每一步都有机械证据：</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>阶段</th>\n      <th>做什么</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>授权门</td>\n      <td>只对明确授权过的根目录做只读分析，其余一律具名拒绝</td>\n    </tr>\n    <tr>\n      <td>侦察</td>\n      <td>项目画像、产物清单、密钥扫描、字符串符号扫描、native 结构、Dart AOT、构建集成</td>\n    </tr>\n    <tr>\n      <td>暴露分级</td>\n      <td>按 T1–T4 分级，修复顺序等于攻击者的边际成本</td>\n    </tr>\n    <tr>\n      <td>保护规划</td>\n      <td>能力族匹配暴露面，答不上来的问题保留为 <code class=\"language-plaintext highlighter-rouge\">intake_unknowns</code></td>\n    </tr>\n    <tr>\n      <td>攻击模拟</td>\n      <td>对抗性自测设计，产物只读，工具失败只能记 <code class=\"language-plaintext highlighter-rouge\">unknown</code></td>\n    </tr>\n    <tr>\n      <td>证据账本</td>\n      <td>追加式记录，每个观测都标注证据等级</td>\n    </tr>\n    <tr>\n      <td>验证门</td>\n      <td>任何阻塞性 unknown 直接拦下，”没发现”不等于”安全”</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>技术参数：Python 3.10+，<strong>零运行时依赖</strong>，2451 个测试通过，35 个 MCP 工具（可直接接进 AI 工作流），MIT 授权。所有分析在本地离线运行，不执行你的项目代码。</p>\n\n<p>PEA 明确写了”诚实的边界”——证据权威分级为 <code class=\"language-plaintext highlighter-rouge\">observation</code> / <code class=\"language-plaintext highlighter-rouge\">inference</code> / <code class=\"language-plaintext highlighter-rouge\">external_claim</code> / <code class=\"language-plaintext highlighter-rouge\">human_assertion</code>，没有默认值，静态证据永远不会冒充运行时观测。这个态度比工具本身更值得参考。</p>\n\n<h2 id=\"放在一起看\">放在一起看</h2>\n\n<p>ShellVMP 管<strong>执行载体的保护</strong>，EmojiShell 管<strong>表象层的伪装</strong>，PEA 管<strong>决策与验证</strong>。三者不冲突，甚至可以串起来用：PEA 找出该保护的点，ShellVMP 处理脚本产物，EmojiShell 做外围混淆。</p>\n\n<h2 id=\"相关链接\">相关链接</h2>\n\n<ul>\n  <li><a href=\"https://github.com/haothtrteen/ShellVMP\">haothtrteen/ShellVMP</a> · <a href=\"https://github.com/haothtrteen/ShellVMP/blob/main/README.md\">README</a></li>\n  <li><a href=\"https://github.com/haothtrteen/EmojiShell\">haothtrteen/EmojiShell</a> · <a href=\"https://github.com/haothtrteen/EmojiShell/blob/main/README.md\">README</a></li>\n  <li><a href=\"https://github.com/haothtrteen/PEA\">haothtrteen/PEA</a> · <a href=\"https://github.com/haothtrteen/PEA/blob/main/README.md\">README</a></li>\n</ul>\n"},

{"title": "TwPatch：不用 root 也能给 APK 注入 hook", "url": "/2026/10/21/twpatch/", "date": "2026-10-21", "tags": ["安卓","逆向"], "content": "<p><a href=\"https://github.com/haothtrteen/TweakMe\">TweakMe</a> 仓库里放的是 TwPatch（TweakMe on Android）——一个<strong>在手机上直接对 APK 做二次打包注入</strong>的工具。</p>\n\n<h2 id=\"它做什么\">它做什么</h2>\n\n<p>选一个 APK，工具完成：</p>\n\n<ol>\n  <li><strong>重打包</strong>——解包、改写、重新组装</li>\n  <li><strong>过签名</strong>——含对主流第三方加固的一定处理能力</li>\n  <li><strong>注入 hook 框架 / 插件</strong>——用 Java 写 hook 代码，一键脚本编译成 dex 插件注入</li>\n  <li><strong>输出可安装的新包</strong></li>\n</ol>\n\n<p>对简单的 Xposed 插件也做了兼容，不需要把原插件改写成私有格式。</p>\n\n<h2 id=\"为什么不用-xposed--frida\">为什么不用 Xposed / Frida</h2>\n\n<p>那些框架要么需要 root，要么需要在目标设备常驻服务。TwPatch 的思路更”一次性”：</p>\n\n<ul>\n  <li>不需要 root，一台正常手机就行</li>\n  <li>对系统版本要求低，5.0 到 13.0 都测过</li>\n  <li>支持 arm 与 arm64 两种 ABI</li>\n  <li>成品是独立 APK，装到别的设备上也能用</li>\n</ul>\n\n<p>代价是每次改动都要重新打包，调试循环比动态 hook 长——适合”改完就用”的场景，不适合频繁试错。</p>\n\n<h2 id=\"和原项目的区别\">和原项目的区别</h2>\n\n<p>TwPatch 基于开源的 TweakMe 制作，主要工作是把操作<strong>简化到能在安卓上跑</strong>：原项目更依赖桌面端命令行，TwPatch 把大部分步骤自动化成了图形操作：选包、配置注入项、生成、安装，一条链路走完。</p>\n\n<p>这个项目从 2023 年就在维护，中间收到很多朋友的测试反馈和 bug 报告，感谢名单都写在仓库 README 里。</p>\n\n<h2 id=\"适用范围\">适用范围</h2>\n\n<p>二次打包注入本身是中性技术，可以用来给自己写的应用加调试能力、给老应用补功能、做兼容性适配。<strong>请只对自己拥有或获得授权分析的应用使用</strong>，不要用来修改他人应用的授权校验或分发破解版本。</p>\n\n<p>工具本身完全免费，如果在其他论坛看到售卖或未经允许的转发，那就不是从这里出去的。</p>\n\n<h2 id=\"相关链接\">相关链接</h2>\n\n<ul>\n  <li>仓库：<a href=\"https://github.com/haothtrteen/TweakMe\">haothtrteen/TweakMe</a></li>\n  <li>原始 README：<a href=\"https://github.com/haothtrteen/TweakMe/blob/main/README.md\">TweakMe/README.md</a></li>\n  <li>上游项目：TweakMe（开源逆向框架）</li>\n</ul>\n"},

{"title": "第一篇文章", "url": "/2026/10/21/hello/", "date": "2026-10-21", "tags": ["建站"], "content": "<p>站点骨架搭好了，记录一下这个开始。</p>\n\n<h2 id=\"这个站是怎么来的\">这个站是怎么来的</h2>\n\n<p>之前这里挂着一个网页版玩机工具，现在已经迁到 <a href=\"https://github.com/haothtrteen/IWPhone\">IWPhone</a> 仓库，这个域名空出来，正好拿来写点东西。</p>\n\n<h2 id=\"之后会写什么\">之后会写什么</h2>\n\n<ul>\n  <li>玩机过程中值得记下来的操作步骤</li>\n  <li>自己写的小工具的使用说明</li>\n  <li>一些踩过的坑</li>\n</ul>\n\n<h2 id=\"怎么发布新文章\">怎么发布新文章</h2>\n\n<p>在 <code class=\"language-plaintext highlighter-rouge\">_posts/</code> 目录下新建一个文件，命名格式是 <code class=\"language-plaintext highlighter-rouge\">YYYY-MM-DD-标题.md</code>，文件开头写：</p>\n\n<div class=\"language-yaml highlighter-rouge\"><div class=\"highlight\"><pre class=\"highlight\"><code><span class=\"nn\">---</span>\n<span class=\"na\">title</span><span class=\"pi\">:</span> <span class=\"s\">文章标题</span>\n<span class=\"nn\">---</span>\n</code></pre></div></div>\n\n<p>正文用 Markdown 写就行，push 之后 GitHub Pages 会自动构建。</p>\n"}
