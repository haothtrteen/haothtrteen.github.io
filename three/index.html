layout: null
---
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0910">
<meta name="description" content="haothtrteen 的博客 3D 入口：一间用 three.js 搭出来的深夜书店。">
<title>深夜书店 · haothtrteen</title>
<style>
  :root {
    --ink: #f4efe6;
    --muted: #a79f95;
    --accent: #ffb066;
    --line: rgba(244, 239, 230, 0.14);
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0910;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }

  #scene:active { cursor: grabbing; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(6, 5, 9, 0.55) 100%),
      linear-gradient(180deg, rgba(6, 5, 9, 0.5), transparent 28%, transparent 70%, rgba(6, 5, 9, 0.62));
  }

  .overlay {
    position: fixed;
    left: clamp(20px, 6vw, 88px);
    bottom: clamp(24px, 8vh, 92px);
    z-index: 3;
    max-width: 430px;
    pointer-events: none;
  }

  .overlay > * { pointer-events: auto; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(20, 17, 26, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .tag i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  h1 {
    margin: 18px 0 0;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.24;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .lede {
    margin: 14px 0 0;
    max-width: 24em;
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 14.5px;
    text-decoration: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
  }

  .btn.primary {
    background: var(--accent);
    color: #241a10;
    font-weight: 600;
  }

  .btn.primary:hover { transform: translateY(-1px); background: #ffc084; }

  .btn.ghost {
    border-color: var(--line);
    color: var(--ink);
    background: rgba(20, 17, 26, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .btn.ghost:hover { border-color: rgba(255, 176, 102, 0.6); color: var(--accent); transform: translateY(-1px); }

  .hint {
    position: fixed;
    right: clamp(16px, 4vw, 40px);
    bottom: clamp(18px, 4vh, 36px);
    z-index: 3;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(244, 239, 230, 0.45);
    user-select: none;
  }

  .back {
    position: fixed;
    top: 22px;
    left: clamp(20px, 6vw, 88px);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: rgba(244, 239, 230, 0.62);
    text-decoration: none;
    transition: color 0.15s;
  }

  .back:hover { color: var(--accent); }

  .loading, .notice {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: #0b0910;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.08em;
    transition: opacity 0.6s ease;
  }

  .loading.is-hidden { opacity: 0; pointer-events: none; }

  .notice { display: none; text-align: center; padding: 24px; line-height: 2; }

  .loading span { display: inline-flex; align-items: center; gap: 10px; }

  .dot-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 720px) {
    .overlay {
      left: 16px;
      right: 16px;
      bottom: max(18px, env(safe-area-inset-bottom));
      max-width: none;
      text-align: center;
    }
    .lede { margin-left: auto; margin-right: auto; font-size: 13.5px; }
    .actions { justify-content: center; margin-top: 18px; }
    .btn { padding: 10px 18px; font-size: 14px; }
    h1 { font-size: 30px; }
    .hint { display: none; }
    .back { top: 16px; left: 16px; }
    .tag { font-size: 11px; }
  }

  /* ---------- 阅读面板 ---------- */

  .overlay { transition: opacity 0.3s ease, transform 0.3s ease; }
  .hint { transition: opacity 0.3s ease; }

  body.is-reading .overlay,
  body.is-reading .hint { opacity: 0; pointer-events: none; transform: translateY(10px); }

  .reader {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    justify-content: flex-end;
    pointer-events: none;
  }

  .reader[hidden] { display: none; }

  .reader-sheet {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    width: min(480px, 100%);
    height: 100%;
    background: #131010;
    border-left: 1px solid rgba(255, 196, 140, 0.16);
    box-shadow: -40px 0 90px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateX(28px);
    transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .reader.is-open .reader-sheet { opacity: 1; transform: none; }

  .reader-head {
    position: relative;
    padding: 26px 26px 18px;
    border-bottom: 1px solid rgba(255, 196, 140, 0.12);
  }

  .reader-meta {
    display: flex;
    gap: 7px;
    font-size: 12px;
    color: #9a9086;
    letter-spacing: 0.04em;
  }

  .reader-dot { opacity: 0.5; }

  .reader-head h2 {
    margin: 10px 0 0;
    padding-right: 36px;
    font-size: 22px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: #f5efe4;
  }

  .reader-close {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 196, 140, 0.18);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.03);
    color: #cfc6b8;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  .reader-close:hover {
    color: #ffb066;
    border-color: rgba(255, 176, 102, 0.5);
    background: rgba(255, 176, 102, 0.08);
  }

  .reader-body {
    flex: 1;
    overflow-y: auto;
    padding: 22px 26px 32px;
    font-size: 15px;
    line-height: 1.9;
    color: #cfc6b8;
    overscroll-behavior: contain;
  }

  .reader-body > *:first-child { margin-top: 0; }
  .reader-body h2 { margin: 30px 0 12px; font-size: 18px; color: #f2e9db; }
  .reader-body h2::before {
    content: "";
    display: inline-block;
    width: 3px;
    height: 0.8em;
    margin-right: 9px;
    border-radius: 2px;
    background: #ffb066;
    vertical-align: -0.06em;
  }
  .reader-body h3 { margin: 22px 0 8px; font-size: 15.5px; color: #f2e9db; }
  .reader-body p { margin: 13px 0; }
  .reader-body ul, .reader-body ol { padding-left: 1.3em; margin: 12px 0; }
  .reader-body li { margin: 5px 0; }
  .reader-body li::marker { color: #ffb066; }
  .reader-body a { color: #ffc089; text-decoration: none; border-bottom: 1px solid rgba(255, 192, 137, 0.3); }
  .reader-body strong { color: #f5efe4; }
  .reader-body code {
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.07);
    font-size: 0.88em;
  }
  .reader-body pre {
    margin: 16px 0;
    padding: 14px 16px;
    overflow-x: auto;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 13px;
    line-height: 1.6;
  }
  .reader-body pre code { background: none; padding: 0; }
  .reader-body blockquote {
    margin: 16px 0;
    padding: 2px 14px;
    border-left: 2px solid rgba(255, 176, 102, 0.5);
    color: #a79d92;
  }
  .reader-body table { width: 100%; margin: 16px 0; border-collapse: collapse; font-size: 13.5px; }
  .reader-body th, .reader-body td { padding: 8px 10px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: left; }
  .reader-body th { background: rgba(255, 255, 255, 0.05); color: #f2e9db; }
  .reader-body img { max-width: 100%; border-radius: 8px; }

  .reader-foot {
    padding: 14px 26px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 196, 140, 0.12);
    font-size: 13.5px;
  }

  .reader-foot a { color: #ffb066; text-decoration: none; }
  .reader-foot a:hover { text-decoration: underline; }

  .tip {
    position: fixed;
    z-index: 7;
    max-width: 260px;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(18, 15, 14, 0.94);
    border: 1px solid rgba(255, 196, 140, 0.25);
    color: #f0e7d8;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    transform: translate(-50%, -150%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .tip.is-visible { opacity: 1; }

  .tip em {
    display: block;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #a08f7c;
  }

  @media (max-width: 720px) {
    .reader { align-items: flex-end; }
    .reader-sheet {
      width: 100%;
      height: 74vh;
      border-left: none;
      border-top: 1px solid rgba(255, 196, 140, 0.16);
      border-radius: 18px 18px 0 0;
      transform: translateY(32px);
    }
    .reader-head { padding: 20px 20px 14px; }
    .reader-head h2 { font-size: 19px; }
    .reader-body { padding: 18px 20px 26px; font-size: 14.5px; }
    .reader-foot { padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot-pulse { animation: none; opacity: 1; }
    .reader-sheet { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D 深夜书店场景"></canvas>
<div class="vignette" aria-hidden="true"></div>

<a class="back" href="/">← 返回博客</a>

<div class="overlay">
  <div class="tag"><i></i>3D · 深夜书店</div>
  <h1>在书架之间<br>翻一翻</h1>
  <p class="lede">桌上立着六本书，每一本都是一篇文章。点开一本，就在这里读完。</p>
  <div class="actions">
    <a class="btn primary" href="/">进入博客</a>
    <a class="btn ghost" href="/#articles">看文章</a>
  </div>
</div>

<div class="hint">拖拽旋转 · 滚轮缩放 · 点击书本阅读</div>

<div class="tip" id="tip" hidden><span id="tip-title"></span><em>点击阅读</em></div>

<section class="reader" id="reader" hidden aria-label="文章阅读面板">
  <div class="reader-sheet">
    <header class="reader-head">
      <div class="reader-meta">
        <span id="reader-date"></span>
        <span class="reader-dot">·</span>
        <span id="reader-tags"></span>
      </div>
      <h2 id="reader-title"></h2>
      <button class="reader-close" id="reader-close" type="button" aria-label="合上书">✕</button>
    </header>
    <div class="reader-body" id="reader-body"></div>
    <footer class="reader-foot">
      <a id="reader-link" href="/">在博客中打开 →</a>
    </footer>
  </div>
</section>

<script type="application/json" id="post-data">
[
{% for post in site.posts %}
{"title": {{ post.title | jsonify }}, "url": {{ post.url | relative_url | jsonify }}, "date": {{ post.date | date: "%Y-%m-%d" | jsonify }}, "tags": {{ post.tags | jsonify }}, "content": {{ post.content | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>

<div class="loading" id="loading"><span><i class="dot-pulse"></i>正在搭建书店…</span></div>
<div class="notice" id="notice"></div>

<script type="module">
/* ------------------------------------------------------------------
 * 3D 深夜书店 · 单文件 three.js 场景
 * 组成：房间 → 书架与书 → 桌椅台灯 → 窗外夜景 → 浮尘
 * 交互：拖拽环绕、滚轮/双指缩放、双击复位、自动缓慢环绕
 * 降级：CDN 三级回退；无 WebGL 或加载失败时显示提示
 * ------------------------------------------------------------------ */

const CDNS = [
  'https://registry.npmmirror.com/three/0.170.0/files/build/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js',
  'https://unpkg.com/three@0.170.0/build/three.module.min.js',
];

const noticeEl = document.getElementById('notice');
const loadingEl = document.getElementById('loading');
const POSTS = JSON.parse(document.getElementById('post-data').textContent || '[]');

function fail(message) {
  noticeEl.textContent = message;
  noticeEl.style.display = 'grid';
  loadingEl.classList.add('is-hidden');
}

let THREE = null;
for (const url of CDNS) {
  try {
    THREE = await import(url);
    break;
  } catch (err) {
    /* 换下一个镜像 */
  }
}

if (!THREE) {
  fail('场景加载失败：无法获取 three.js，请检查网络后刷新。');
  throw new Error('three.js unavailable');
}

const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  fail('当前浏览器不支持 WebGL，无法显示 3D 场景。');
  throw err;
}

const isMobile = matchMedia('(max-width: 720px)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0910, 0.042);

const portrait = innerHeight > innerWidth;
const camera = new THREE.PerspectiveCamera(portrait ? 44 : 38, innerWidth / innerHeight, 0.1, 120);

/* ---------- 随机数：每次加载布局一致 ---------- */

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261124);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[(rand() * arr.length) | 0];

/* ---------- 程序化贴图 ---------- */

function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return [c, c.getContext('2d')];
}

function woodTexture() {
  const [c, ctx] = makeCanvas(512);
  ctx.fillStyle = '#3a2a1e';
  ctx.fillRect(0, 0, 512, 512);
  const plank = 64;
  for (let y = 0; y < 512; y += plank) {
    const tone = 0.82 + rand() * 0.3;
    ctx.fillStyle = `rgb(${(58 * tone) | 0}, ${(42 * tone) | 0}, ${(30 * tone) | 0})`;
    ctx.fillRect(0, y, 512, plank);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y + plank - 1);
    ctx.lineTo(512, y + plank - 1);
    ctx.stroke();
    for (let g = 0; g < 26; g++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.03 + rand() * 0.05})`;
      ctx.lineWidth = 1;
      const gy = y + rand() * plank;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.bezierCurveTo(170, gy + rr(-3, 3), 340, gy + rr(-3, 3), 512, gy + rr(-2, 2));
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function nightTexture() {
  const [c, ctx] = makeCanvas(512);
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#0d1b33');
  g.addColorStop(0.55, '#122544');
  g.addColorStop(1, '#1b3357');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 90; i++) {
    const x = rand() * 512;
    const y = 250 + rand() * 250;
    const w = rr(3, 9);
    const h = rr(4, 12);
    ctx.fillStyle = rand() < 0.35 ? 'rgba(255, 205, 140, 0.75)' : 'rgba(140, 175, 220, 0.32)';
    ctx.fillRect(x, y, w, h);
  }
  ctx.fillStyle = 'rgba(6, 10, 18, 0.85)';
  ctx.fillRect(0, 470, 512, 42);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------- 材质 ---------- */

const matWood = new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.82, metalness: 0.04 });
const matWoodDark = new THREE.MeshStandardMaterial({ color: 0x35261b, roughness: 0.9 });
const matWall = new THREE.MeshStandardMaterial({ color: 0x241d20, roughness: 0.95 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.42, metalness: 0.75 });
const matPaper = new THREE.MeshStandardMaterial({ color: 0xe8ddc8, roughness: 0.95 });

/* ---------- 房间 ---------- */

const ROOM = 6;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2 + 4, ROOM * 2 + 4), matWood);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

function wall(w, h, pos, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), matWall);
  m.position.copy(pos);
  m.rotation.y = rotY;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

wall(ROOM * 2, 5.2, new THREE.Vector3(0, 2.6, -ROOM), 0);
wall(ROOM * 2, 5.2, new THREE.Vector3(-ROOM, 2.6, 0), Math.PI / 2);

// 天花板：避免上方出现虚空
const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM * 2, ROOM * 2),
  new THREE.MeshStandardMaterial({ color: 0x1b161b, roughness: 1, side: THREE.DoubleSide })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 5.2;
scene.add(ceiling);

// 右侧墙：留出窗户的位置，用四块拼起来
const WY = 2.15, WW = 2.9, WH = 2.3;
wall(ROOM * 2, 5.2, new THREE.Vector3(ROOM, 2.6, 0), -Math.PI / 2);
const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(WW, WH),
  new THREE.MeshBasicMaterial({ map: nightTexture(), color: 0xb6c2d6 })
);
glass.rotation.y = -Math.PI / 2;
glass.position.set(ROOM - 0.02, WY, 0.2);
scene.add(glass);

// 窗框
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1418, roughness: 0.7 });
function frameBox(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  m.position.set(x, y, z);
  scene.add(m);
}
frameBox(0.08, WH + 0.18, 0.09, ROOM - 0.05, WY, 0.2 - WW / 2);
frameBox(0.08, WH + 0.18, 0.09, ROOM - 0.05, WY, 0.2 + WW / 2);
frameBox(0.08, 0.1, WW + 0.18, ROOM - 0.05, WY + WH / 2, 0.2);
frameBox(0.08, 0.1, WW + 0.18, ROOM - 0.05, WY - WH / 2, 0.2);
frameBox(0.06, WH, 0.06, ROOM - 0.05, WY, 0.2);

/* ---------- 书架与书 ---------- */

const BOOK_COLORS = [
  0x8c3b36, 0xa8564a, 0x2f4858, 0x3b6572, 0x4a5c3a, 0x6b7a45,
  0x7a5a3a, 0x9c7a4a, 0x4b3f6b, 0x6a4a6b, 0x2f2f38, 0xc9b48a,
];

const bookGeo = new THREE.BoxGeometry(1, 1, 1);
const bookMat = new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.02 });
const dummy = new THREE.Object3D();
const color = new THREE.Color();

function addBookshelf({ x, z, rotY, width, rows, height = 3.05, depth = 0.44 }) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.y = rotY;
  scene.add(group);

  const sideGeo = new THREE.BoxGeometry(0.07, height, depth);
  for (const sx of [-width / 2, width / 2]) {
    const side = new THREE.Mesh(sideGeo, matWoodDark);
    side.position.set(sx, height / 2, 0);
    side.castShadow = true;
    group.add(side);
  }

  const back = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.04), matWoodDark);
  back.position.set(0, height / 2, -depth / 2 + 0.02);
  group.add(back);

  const boardGeo = new THREE.BoxGeometry(width, 0.05, depth);
  const rowH = height / rows;

  for (let r = 0; r <= rows; r++) {
    const board = new THREE.Mesh(boardGeo, matWoodDark);
    board.position.set(0, r * rowH, 0);
    board.castShadow = true;
    board.receiveShadow = true;
    group.add(board);
  }

  // 每层的书
  const maxBooks = 260;
  const books = new THREE.InstancedMesh(bookGeo, bookMat, maxBooks);
  books.castShadow = true;
  let index = 0;

  for (let r = 0; r < rows; r++) {
    const baseY = r * rowH + 0.025;
    let cursor = -width / 2 + 0.09;
    const limit = width / 2 - 0.09;

    while (cursor < limit && index < maxBooks) {
      if (rand() < 0.05) {
        cursor += rr(0.05, 0.16);
        continue;
      }
      const w = rr(0.055, 0.13);
      const h = Math.min(rr(0.17, 0.27), rowH - 0.1);
      const d = rr(0.16, 0.23);
      const lean = rand() < 0.07 ? rr(-0.11, 0.11) : 0;

      dummy.position.set(cursor + w / 2, baseY + h / 2, rr(-0.03, 0.04));
      dummy.rotation.set(0, 0, lean);
      dummy.scale.set(w, h, d);
      dummy.updateMatrix();
      books.setMatrixAt(index, dummy.matrix);
      books.setColorAt(index, color.setHex(pick(BOOK_COLORS)).multiplyScalar(rr(0.8, 1.12)));
      index++;

      cursor += w + 0.008 + Math.abs(lean) * 0.08;
    }
  }

  books.count = index;
  books.instanceMatrix.needsUpdate = true;
  if (books.instanceColor) books.instanceColor.needsUpdate = true;
  group.add(books);
}

function shortTitle(title) {
  const head = title.split(/[：:]/)[0].trim();
  return head.length > 9 ? head.slice(0, 9) : head;
}

function spineTexture(title, hex) {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 512;
  const ctx = c.getContext('2d');

  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, 128, 512);

  ctx.strokeStyle = 'rgba(255, 228, 180, 0.55)';
  ctx.lineWidth = 3;
  ctx.strokeRect(12, 16, 104, 480);

  ctx.save();
  ctx.translate(64, 46);
  ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#f7ecd6';
  ctx.textBaseline = 'middle';

  let size = 40;
  do {
    ctx.font = '600 ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    size -= 1;
  } while (ctx.measureText(title).width > 400 && size > 16);
  ctx.fillText(title, 0, 0);
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function glowTexture() {
  const [c, ctx] = makeCanvas(128);
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255, 214, 168, 1)');
  g.addColorStop(0.32, 'rgba(255, 176, 102, 0.42)');
  g.addColorStop(1, 'rgba(255, 150, 80, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = glowTexture();

function addGlow(parent, y, size, opacity) {

      blending: THREE.AdditiveBlending,
    })
  );
  sprite.scale.set(size, size, 1);
  sprite.position.y = y;
  parent.add(sprite);
}

/* ---------- 相机控制 ---------- */

const target = new THREE.Vector3(0.85, 1.15, -0.85);
const targetGoal = target.clone();
const baseRadius = portrait ? 10.8 : 8.0;
const cam = { theta: -0.78, phi: 1.32, radius: baseRadius };
const goal = { theta: cam.theta, phi: cam.phi, radius: cam.radius };

let dragging = false;
let lastX = 0;
let lastY = 0;
let pinchDist = 0;
const clock = new THREE.Clock();

function applyCamera() {
  const sp = Math.sin(cam.phi);
  camera.position.set(
    target.x + cam.radius * sp * Math.sin(cam.theta),
    target.y + cam.radius * Math.cos(cam.phi),
    target.z + cam.radius * sp * Math.cos(cam.theta)
  );
  camera.lookAt(target);
}
applyCamera();

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  goal.theta -= dx * 0.005;
  goal.phi = Math.min(1.46, Math.max(0.72, goal.phi - dy * 0.004));
});

function endDrag(e) {
  dragging = false;
  if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
    canvas.releasePointerCapture(e.pointerId);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  goal.radius = Math.min(15, Math.max(4.6, goal.radius + e.deltaY * 0.0032));
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  goal.theta = -0.78;
  goal.phi = 1.32;
  goal.radius = baseRadius;
});

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (pinchDist > 0) {
      goal.radius = Math.min(15, Math.max(4.6, goal.radius * (pinchDist / d)));
    }
    pinchDist = d;
  }
}, { passive: false });

/* ---------- 点书阅读 ---------- */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = -1;
let reading = -1;
let downX = 0;
let downY = 0;
let downTime = 0;

const readerEl = document.getElementById('reader');
const readerBody = document.getElementById('reader-body');
const readerTitle = document.getElementById('reader-title');
const readerDate = document.getElementById('reader-date');
const readerTags = document.getElementById('reader-tags');
const readerLink = document.getElementById('reader-link');
const tipEl = document.getElementById('tip');
const tipTitle = document.getElementById('tip-title');

function pickBook(clientX, clientY) {
  pointer.x = (clientX / innerWidth) * 2 - 1;
  pointer.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(featured, false);
  return hits.length ? hits[0].object.userData.index : -1;
}

canvas.addEventListener('pointermove', (e) => {
  const hit = pickBook(e.clientX, e.clientY);
  if (hit !== hovered) {
    hovered = hit;
    canvas.style.cursor = hit >= 0 ? 'pointer' : 'grab';
  }

  if (hit >= 0 && !dragging) {
    tipTitle.textContent = featured[hit].userData.post.title;
    tipEl.style.left = e.clientX + 'px';
    tipEl.style.top = e.clientY + 'px';
    tipEl.hidden = false;
    tipEl.classList.add('is-visible');
  } else {
    tipEl.classList.remove('is-visible');
    tipEl.hidden = true;
  }
});

canvas.addEventListener('pointerdown', (e) => {
  downX = e.clientX;
  downY = e.clientY;
  downTime = performance.now();
});

function openReader(index) {
  const book = featured[index];
  const post = book.userData.post;
  if (!post) return;

  reading = index;
  tipEl.classList.remove('is-visible');
  tipEl.hidden = true;
  readerTitle.textContent = post.title;
  readerDate.textContent = post.date;
  readerTags.textContent = (post.tags || []).join(' · ');
  readerBody.innerHTML = post.content;
  readerBody.scrollTop = 0;
  readerLink.href = post.url;

  readerEl.hidden = false;
  requestAnimationFrame(() => readerEl.classList.add('is-open'));
  document.body.classList.add('is-reading');

  featured.forEach((b, i) => {
    b.userData.target.z = i === index ? b.userData.home.z + 0.3 : b.userData.home.z;
    b.userData.target.y = i === index ? b.userData.home.y + 0.05 : b.userData.home.y;
    b.userData.target.ry = i === index ? -0.28 : 0;
  });

  const offset = innerWidth > 720 ? 0.26 : 0;
  targetGoal.set(book.position.x + offset, 1.02, -0.34);
  goal.radius = innerWidth > 720 ? 2.0 : 2.8;
  goal.phi = 1.4;
  goal.theta = 0.08;
}

function closeReader() {
  if (reading < 0) return;
  reading = -1;
  readerEl.classList.remove('is-open');
  document.body.classList.remove('is-reading');
  setTimeout(() => {
    if (reading < 0) readerEl.hidden = true;
  }, 460);

  featured.forEach((b) => {
    b.userData.target.z = b.userData.home.z;
    b.userData.target.y = b.userData.home.y;
    b.userData.target.ry = 0;
  });

  targetGoal.set(0.85, 1.15, -0.85);
  goal.radius = baseRadius;
  goal.phi = 1.32;
  goal.theta = -0.78;
}

canvas.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 8 || performance.now() - downTime > 600) return;

  const hit = pickBook(e.clientX, e.clientY);
  if (hit >= 0) {
    openReader(hit);
  } else if (reading >= 0) {
    closeReader();
  }
});

document.getElementById('reader-close').addEventListener('click', closeReader);

addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && reading >= 0) closeReader();
});

/* ---------- 循环 ---------- */

let firstFrame = true;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (!dragging && !reduceMotion && reading < 0) {
    goal.theta += dt * 0.035;
  }

  target.lerp(targetGoal, Math.min(1, dt * 3.2));

  featured.forEach((book) => {
    const state = book.userData;
    book.position.y += (state.target.y - book.position.y) * Math.min(1, dt * 6);
    book.position.z += (state.target.z - book.position.z) * Math.min(1, dt * 6);
    book.rotation.y += (state.target.ry - book.rotation.y) * Math.min(1, dt * 6);

    const wanted = hovered === state.index || reading === state.index ? 1 : 0;
    state.hover += (wanted - state.hover) * Math.min(1, dt * 9);

    state.spineMat.emissiveIntensity = 0.06 + state.hover * 0.42;
    book.scale.setScalar(1 + state.hover * 0.045);
  });

  cam.theta += (goal.theta - cam.theta) * Math.min(1, dt * 6);
  cam.phi += (goal.phi - cam.phi) * Math.min(1, dt * 6);
  cam.radius += (goal.radius - cam.radius) * Math.min(1, dt * 6);

  applyCamera();
  camera.position.y += Math.sin(t * 0.45) * 0.012;

  // 灯光的呼吸
  pendantLight.intensity = 26 + Math.sin(t * 1.7) * 0.8 + Math.sin(t * 5.3) * 0.25;
  lampLight.intensity = 9 + Math.sin(t * 2.1 + 1.2) * 0.35;

  dust.rotation.y = t * 0.012;
  dust.position.y = Math.sin(t * 0.22) * 0.06;

  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    loadingEl.classList.add('is-hidden');
    setTimeout(() => loadingEl.remove(), 700);
  }
}

renderer.setAnimationLoop(() => {
  if (!document.hidden) animate();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerHeight > innerWidth ? 44 : 38;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
  renderer.setSize(innerWidth, innerHeight);
});

addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  fail('WebGL 上下文丢失，请刷新页面重试。');
});
